name: End-to-end on macOS

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Packaged app on macos
    # Avrea minutes are paid: a PR spends them only once labelled.
    if: >-
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e:macos') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e:macos'))
    # At job level, so a skipped run (another label added) does not cancel the one in progress.
    concurrency:
      group: e2e-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: avrea-macos-latest-8-vcpu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-macos
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore
