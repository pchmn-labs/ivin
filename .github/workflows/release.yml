name: Release

on:
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    name: Publish an unsigned GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - id: check
        run: node tools/release/main.ts check
      - if: steps.check.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec release-it --ci
          echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - if: steps.check.outputs.release == 'true'
        run: pnpm package
      - if: steps.check.outputs.release == 'true'
        run: |
          ditto -c -k --keepParent apps/desktop/release/mac-arm64/ivin.app "ivin-$VERSION-arm64.zip"
          node tools/release/main.ts manifest "$VERSION" "ivin-$VERSION-arm64.zip" manifest.json
          node tools/release/main.ts notes notes.md
      - if: steps.check.outputs.release == 'true'
        run: git push --atomic origin HEAD "refs/tags/v$VERSION"
      - if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "ivin-$VERSION-arm64.zip" manifest.json --title "v$VERSION" --notes-file notes.md
