name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/test-setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - if: github.event_name == 'pull_request'
        run: pnpm vp test run --changed origin/${{ github.base_ref }} --project node --project ui-browser
      - if: github.event_name != 'pull_request'
        run: pnpm vp test run --project node --project ui-browser

  frame-rates:
    name: UI frame rates
    # Not on a pull request: a shared runner's frame rate varies too much to block a merge.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/test-setup
      - run: pnpm vp test run --project ui-perf

  e2e-linux:
    name: Packaged app on linux
    # A skipped job passes the required check; AGENTS.md says when a pull request takes the label.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e:linux')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/packaged-app-e2e
        with:
          e2e: xvfb-run -a pnpm e2e

  e2e-macos:
    name: Packaged app on macos
    # A skipped job passes the required check; AGENTS.md says when a pull request takes the label.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e:macos')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/packaged-app-e2e
        with:
          e2e: pnpm e2e
