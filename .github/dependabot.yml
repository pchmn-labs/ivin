version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # ADR-0008 ships pnpm 11, a JavaScript package, not pnpm 12's native executable.
      - dependency-name: pnpm
        update-types: ["version-update:semver-major"]
