name: Packaged app end-to-end tests
description: Package ivin and run its end-to-end tests against the package.

inputs:
  e2e:
    description: Command that runs the end-to-end tests.
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm package
      shell: bash
    # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs.
    - if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      shell: bash
    - run: ${{ inputs.e2e }}
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: failure()
      with:
        name: playwright-report-${{ runner.os }}
        path: |
          apps/desktop/playwright-report
          apps/desktop/test-results
        if-no-files-found: ignore
