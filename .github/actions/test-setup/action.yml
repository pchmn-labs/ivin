name: Test setup
description: Install the dependencies and the Chromium the browser tests run in.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      run: echo "version=$(pnpm --filter @ivin/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm --filter @ivin/ui exec playwright install --with-deps chromium
      shell: bash
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm --filter @ivin/ui exec playwright install-deps chromium
      shell: bash
