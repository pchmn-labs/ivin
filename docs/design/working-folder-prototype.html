<!doctype html>
<html lang="en" data-theme="forest-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ivin: working folder prototype</title>
<style>
:root {
  --iv-status-working: var(--iv-accent);
  --iv-status-waiting: var(--iv-danger);
  --iv-status-idle: var(--iv-text-faint);
  --iv-status-failed: var(--iv-danger);
  --iv-danger-outline: color-mix(in srgb, var(--iv-danger) 60%, transparent);

  --iv-font-sans:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --iv-font-mono: ui-monospace, "SF Mono", Menlo, monospace;

  --iv-text-xs: 11px;
  --iv-text-xs-lh: 16px;
  --iv-text-sm: 12px;
  --iv-text-sm-lh: 16px;
  --iv-text-md: 13px;
  --iv-text-md-lh: 20px;
  --iv-text-lg: 14px;
  --iv-text-lg-lh: 20px;
  --iv-text-xl: 16px;
  --iv-text-xl-lh: 24px;
  --iv-text-2xl: 20px;
  --iv-text-2xl-lh: 28px;

  --iv-weight-regular: 400;
  --iv-weight-medium: 500;
  --iv-weight-semibold: 600;

  --iv-space-1: 4px;
  --iv-space-2: 8px;
  --iv-space-3: 12px;
  --iv-space-4: 16px;
  --iv-space-5: 20px;
  --iv-space-6: 24px;
  --iv-space-7: 28px;
  --iv-space-8: 32px;
  --iv-space-9: 36px;
  --iv-space-10: 40px;

  --iv-radius-sm: 4px;
  --iv-radius-md: 6px;
  --iv-radius-lg: 10px;
  --iv-radius-card: 10px;

  --iv-traffic-lights-width: 70px;
  --iv-control-sm: 24px;
  --iv-control-md: 28px;
  --iv-row-height: 30px;
  --iv-content-width: 760px;

  --iv-opacity-disabled: 0.45;

  --iv-duration-fast: 120ms;
  --iv-duration-base: 180ms;
  --iv-duration-spin: 900ms;
  --iv-duration-pulse: 1600ms;
  --iv-ease-out: cubic-bezier(0.22, 1, 0.36, 1);

  --iv-bg: #161e1a;
  --iv-bg-subtle: #0b110e;
  --iv-bg-raised: #1e2823;
  --iv-bg-card: #0b110e;
  --iv-bg-hover: rgba(169, 217, 160, 0.06);
  --iv-bg-active: rgba(169, 217, 160, 0.11);
  --iv-border: rgba(214, 235, 220, 0.08);
  --iv-border-strong: rgba(214, 235, 220, 0.15);
  --iv-text: #e4ebe6;
  --iv-text-muted: #9daba2;
  --iv-text-faint: #788a7e;
  --iv-accent: #a9d9a0;
  --iv-accent-hover: #bde5b5;
  --iv-accent-contrast: #0b2318;
  --iv-danger: #f0644a;
  --iv-danger-subtle: rgba(229, 83, 59, 0.14);
  --iv-focus-ring: #a9d9a0;
  --iv-backdrop: rgba(5, 10, 8, 0.5);
  --iv-shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
  --iv-project-hue-0: #8fbf98;
  --iv-project-hue-1: #8fadd6;
  --iv-project-hue-2: #d2b273;
  --iv-project-hue-3: #bc98cc;
  --iv-project-hue-4: #cf9d80;
  --iv-project-hue-5: #7fc0ba;
  --iv-bubble: color-mix(in srgb, var(--iv-accent) 14%, var(--iv-bg-raised));
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --iv-bg: #eeede2;
    --iv-bg-subtle: #e9e8db;
    --iv-bg-raised: #f7f6ee;
    --iv-bg-card: #e4e4d5;
    --iv-bg-hover: rgba(42, 56, 28, 0.05);
    --iv-bg-active: rgba(42, 56, 28, 0.09);
    --iv-border: rgba(42, 56, 28, 0.12);
    --iv-border-strong: rgba(42, 56, 28, 0.2);
    --iv-text: #1c2a1f;
    --iv-text-muted: #4f5a49;
    --iv-text-faint: #5b6555;
    --iv-accent: #2f6a3c;
    --iv-accent-hover: #265833;
    --iv-accent-contrast: #ffffff;
    --iv-danger: #b8432b;
    --iv-danger-subtle: rgba(184, 67, 43, 0.1);
    --iv-focus-ring: #2f6a3c;
    --iv-backdrop: rgba(11, 35, 24, 0.32);
    --iv-shadow-overlay: 0 8px 24px rgba(11, 35, 24, 0.14), 0 2px 6px rgba(11, 35, 24, 0.08);
    --iv-project-hue-0: #3f7a4c;
    --iv-project-hue-1: #3d6496;
    --iv-project-hue-2: #87661a;
    --iv-project-hue-3: #76508e;
    --iv-project-hue-4: #93593a;
    --iv-project-hue-5: #2f7570;
    --iv-bubble: color-mix(in srgb, var(--iv-accent) 16%, var(--iv-bg-raised));
    color-scheme: light;
  }
}

:root[data-theme="forest-dark"] {
  --iv-bg: #161e1a;
  --iv-bg-subtle: #0b110e;
  --iv-bg-raised: #1e2823;
  --iv-bg-card: #0b110e;
  --iv-bg-hover: rgba(169, 217, 160, 0.06);
  --iv-bg-active: rgba(169, 217, 160, 0.11);
  --iv-border: rgba(214, 235, 220, 0.08);
  --iv-border-strong: rgba(214, 235, 220, 0.15);
  --iv-text: #e4ebe6;
  --iv-text-muted: #9daba2;
  --iv-text-faint: #788a7e;
  --iv-accent: #a9d9a0;
  --iv-accent-hover: #bde5b5;
  --iv-accent-contrast: #0b2318;
  --iv-danger: #f0644a;
  --iv-danger-subtle: rgba(229, 83, 59, 0.14);
  --iv-focus-ring: #a9d9a0;
  --iv-backdrop: rgba(5, 10, 8, 0.5);
  --iv-shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
  --iv-project-hue-0: #8fbf98;
  --iv-project-hue-1: #8fadd6;
  --iv-project-hue-2: #d2b273;
  --iv-project-hue-3: #bc98cc;
  --iv-project-hue-4: #cf9d80;
  --iv-project-hue-5: #7fc0ba;
  --iv-bubble: color-mix(in srgb, var(--iv-accent) 14%, var(--iv-bg-raised));
  color-scheme: dark;
}

:root[data-theme="forest-light"] {
  --iv-bg: #eeede2;
  --iv-bg-subtle: #e9e8db;
  --iv-bg-raised: #f7f6ee;
  --iv-bg-card: #e4e4d5;
  --iv-bg-hover: rgba(42, 56, 28, 0.05);
  --iv-bg-active: rgba(42, 56, 28, 0.09);
  --iv-border: rgba(42, 56, 28, 0.12);
  --iv-border-strong: rgba(42, 56, 28, 0.2);
  --iv-text: #1c2a1f;
  --iv-text-muted: #4f5a49;
  --iv-text-faint: #5b6555;
  --iv-accent: #2f6a3c;
  --iv-accent-hover: #265833;
  --iv-accent-contrast: #ffffff;
  --iv-danger: #b8432b;
  --iv-danger-subtle: rgba(184, 67, 43, 0.1);
  --iv-focus-ring: #2f6a3c;
  --iv-backdrop: rgba(11, 35, 24, 0.32);
  --iv-shadow-overlay: 0 8px 24px rgba(11, 35, 24, 0.14), 0 2px 6px rgba(11, 35, 24, 0.08);
  --iv-project-hue-0: #3f7a4c;
  --iv-project-hue-1: #3d6496;
  --iv-project-hue-2: #87661a;
  --iv-project-hue-3: #76508e;
  --iv-project-hue-4: #93593a;
  --iv-project-hue-5: #2f7570;
  --iv-bubble: color-mix(in srgb, var(--iv-accent) 16%, var(--iv-bg-raised));
  color-scheme: light;
}

/* Prototype only: the PR checks dot. */
:root { --iv-warning: #e0b340; }
@media (prefers-color-scheme: light) { :root:not([data-theme]) { --iv-warning: #a87a0e; } }
:root[data-theme="forest-light"] { --iv-warning: #a87a0e; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--iv-bg); color: var(--iv-text);
  font-family: var(--iv-font-sans); font-size: var(--iv-text-md); line-height: var(--iv-text-md-lh);
  -webkit-font-smoothing: antialiased; cursor: default;
}
::selection { background: color-mix(in srgb, var(--iv-accent) 32%, transparent); }
:focus-visible { outline: 2px solid var(--iv-focus-ring); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
* { scrollbar-width: thin; scrollbar-color: var(--iv-border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--iv-border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: default; text-align: left; }
input, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--iv-font-mono); }
.faint { color: var(--iv-text-faint); }
.muted { color: var(--iv-text-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#stage { height: 100vh; }

.ic { flex: none; display: block; }
.ic * { vector-effect: non-scaling-stroke; }
.spin { animation: spin var(--iv-duration-spin) linear infinite; animation-delay: var(--d, 0ms); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(4px); } }
@keyframes pop-in { from { opacity: 0; transform: scale(.97); } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
  height: var(--iv-control-md); padding: 0 12px; border-radius: var(--iv-radius-md);
  border: 1px solid transparent; font-weight: 500; white-space: nowrap;
  transition: background-color var(--iv-duration-fast) ease-out, color var(--iv-duration-fast) ease-out, transform 160ms var(--iv-ease-out);
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--iv-accent); color: var(--iv-accent-contrast); }
.btn-primary:active:not(:disabled) { background: var(--iv-accent-hover); }
.btn-secondary { background: var(--iv-bg-raised); border-color: var(--iv-border-strong); color: var(--iv-text); }
.btn-ghost { color: var(--iv-text-muted); }
.btn-ghost:active:not(:disabled), .btn-secondary:active:not(:disabled) { background: var(--iv-bg-active); }
.btn-ghost[aria-pressed="true"], .btn-ghost[aria-expanded="true"] { background: var(--iv-bg-active); color: var(--iv-text); }
.btn-danger { background: var(--iv-danger-subtle); color: var(--iv-danger); }
.btn-sm { height: var(--iv-control-sm); padding: 0 8px; font-size: var(--iv-text-sm); line-height: var(--iv-text-sm-lh); gap: 4px; }
.btn-icon { width: var(--iv-control-md); padding: 0; }
.btn-sm.btn-icon { width: var(--iv-control-sm); }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover:not(:disabled) { background: var(--iv-accent-hover); }
  .btn-secondary:hover:not(:disabled), .btn-ghost:hover:not(:disabled) { background: var(--iv-bg-hover); color: var(--iv-text); }
  .btn-danger:hover { background: color-mix(in srgb, var(--iv-danger) 22%, transparent); }
}
kbd { font-family: var(--iv-font-sans); font-size: var(--iv-text-xs); font-weight: 500; opacity: .7; }

/* Status mark */
.mark { width: 12px; height: 12px; flex: none; display: grid; place-items: center; }
.mark > i { display: block; border-radius: 50%; }
.mark[data-status="working"] > i { width: 6px; height: 6px; background: var(--iv-status-working); animation: pulse var(--iv-duration-pulse) ease-in-out infinite; animation-delay: var(--d, 0ms); }
.mark[data-status="waiting"] > i { width: 8px; height: 8px; background: var(--iv-status-waiting); }
.mark[data-status="idle"] > i { width: 7px; height: 7px; border: 1.5px solid var(--iv-status-idle); }
.mark[data-status="failed"] { color: var(--iv-status-failed); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }

/* Window chrome */
.app { height: 100vh; width: 100vw; overflow: hidden; position: relative; }
.lights { display: flex; align-items: center; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--iv-border-strong); }

/* Tabs */
.topbar { display: flex; align-items: center; gap: 4px; height: 40px; flex: none; margin-top: 8px; padding: 0 12px 0 8px; min-width: 0; --ring: var(--iv-bg); }
.topbar .lights-spacer { width: 70px; flex: none; }
.nav-arrows { display: flex; gap: 2px; flex: none; margin-right: 4px; }
.tabs { display: flex; align-items: center; min-width: 0; flex: 0 1 auto; height: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; flex: 0 1 auto; min-width: 96px; max-width: 220px; height: 30px; border-radius: 8px; transition: background-color var(--iv-duration-fast) ease-out; }
.tab + .tab { margin-left: 1px; }
.tab:not([data-active]) + .tab:not([data-active])::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 1px; background: var(--iv-border-strong); transition: opacity var(--iv-duration-fast) ease-out; }
.tab[data-active] { --ring: var(--iv-bg-raised); background: var(--iv-bg-raised); box-shadow: 0 0 0 1px var(--iv-border); }
.tab-btn {
  display: flex; align-items: center; gap: 8px; height: 100%; min-width: 0; width: 100%;
  padding: 0 10px; color: var(--iv-text-muted); font-weight: 500; font-size: var(--iv-text-sm);
  border-radius: 8px; transition: color var(--iv-duration-fast) ease-out;
}
.tab-btn:focus-visible { outline-offset: -2px; }
.tab-title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[data-active] .tab-btn { color: var(--iv-text); }
.tab:focus-within .tab-btn { padding-right: 30px; }
.tab-x {
  position: absolute; right: 5px; top: 50%; margin-top: -10px; width: 20px; height: 20px;
  display: grid; place-items: center; border-radius: var(--iv-radius-sm); color: var(--iv-text-faint);
  opacity: 0; pointer-events: none; transition: opacity var(--iv-duration-fast) ease-out, background-color var(--iv-duration-fast) ease-out, transform 160ms var(--iv-ease-out);
}
.tab-x:active { transform: scale(.97); background: var(--iv-bg-active); }
.tab:focus-within .tab-x { opacity: 1; pointer-events: auto; }
@media (hover: hover) and (pointer: fine) {
  .tab:hover .tab-btn { padding-right: 30px; color: var(--iv-text); }
  .tab:hover .tab-x { opacity: 1; pointer-events: auto; }
  .tab:not([data-active]):hover { background: var(--iv-bg-hover); }
  .tab:hover::before, .tab:hover + .tab::before { opacity: 0; }
  .tab-x:hover { background: var(--iv-bg-hover); color: var(--iv-text); }
}
.topbar .tab-add { flex: none; margin-left: 4px; }
.pr-ic { position: relative; flex: none; display: grid; place-items: center; color: var(--iv-text-faint); }
.pr-ic::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--ring, var(--iv-bg)); }
.pr-ic[data-checks="running"]::after { background: var(--iv-warning); }
.pr-ic[data-checks="failed"]::after { background: var(--iv-danger); }
.pr-ic[data-checks="passed"]::after { background: var(--iv-accent); }
.hsvg { display: block; flex: none; }
.hmark { position: relative; flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: var(--iv-text); }
.hdot { position: absolute; right: -3px; bottom: -3px; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--ring, var(--iv-bg)); }
.hdot[data-status="working"] { width: 10px; height: 10px; right: -4px; bottom: -4px; background: var(--ring, var(--iv-bg)); border: 1.5px solid var(--iv-status-working); border-right-color: transparent; animation: spin var(--iv-duration-spin) linear infinite; animation-delay: var(--d, 0ms); }
.hdot[data-status="background"] { background: var(--iv-status-working); }
.hdot[data-status="waiting"] { width: 11px; height: 11px; right: -4px; bottom: -4px; color: var(--iv-status-working); background: var(--ring, var(--iv-bg)); }
.hdot[data-status="waiting"][data-need="approval"] { color: var(--iv-danger); }
.hdot svg { display: block; }
.row[data-need="approval"] { outline: 1px dashed color-mix(in srgb, var(--iv-danger) 60%, transparent); outline-offset: -1px; }
.hdot[data-status="failed"] { background: var(--ring, var(--iv-bg)); border: 1.5px solid var(--iv-status-failed); }
.hdot[data-status="idle"] { display: none; }
.tip { position: fixed; z-index: 70; padding: 4px 8px; border-radius: var(--iv-radius-sm); background: var(--iv-bg-raised); border: 1px solid var(--iv-border-strong); box-shadow: var(--iv-shadow-overlay); color: var(--iv-text); font-size: var(--iv-text-sm); line-height: var(--iv-text-sm-lh); font-weight: 500; white-space: nowrap; pointer-events: none; animation: pop-in var(--iv-duration-fast) var(--iv-ease-out); }
.tip.instant { animation: none; }

/* Sidebar lists */
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
.group-label { display: flex; align-items: center; gap: 6px; padding: 12px 8px 4px; font-size: var(--iv-text-xs); line-height: var(--iv-text-xs-lh); font-weight: 500; color: var(--iv-text-faint); }
.group-label.hot { color: var(--iv-danger); }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row {
  display: flex; align-items: center; gap: 8px; width: 100%; height: var(--iv-row-height);
  padding: 0 8px; border-radius: var(--iv-radius-md); color: var(--iv-text);
  transition: background-color var(--iv-duration-fast) ease-out;
}
.row:focus-visible { outline-offset: -2px; }
.row:active { background: var(--iv-bg-active); }
.row[aria-current="true"] { background: var(--iv-bg-active); font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--iv-bg-hover); } .row[aria-current="true"]:hover { background: var(--iv-bg-active); } }
.row-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-time { flex: none; font-size: var(--iv-text-xs); color: var(--iv-text-faint); font-variant-numeric: tabular-nums; font-weight: 400; }
.row-2 { height: 44px; align-items: flex-start; padding-top: 6px; }
.row-2 .mark { margin-top: 4px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-branch { font-size: var(--iv-text-xs); line-height: var(--iv-text-xs-lh); color: var(--iv-text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
.row-2 .row-time { line-height: 20px; }
.pr-badge { position: relative; flex: none; color: var(--iv-text-faint); display: grid; place-items: center; }
.pr-badge[data-fail]::after { content: ""; position: absolute; top: -1px; right: -2px; width: 6px; height: 6px; border-radius: 50%; background: var(--iv-danger); box-shadow: 0 0 0 1.5px var(--side-bg, var(--iv-bg-subtle)); }
.fold-head { display: flex; align-items: center; gap: 6px; width: 100%; height: 28px; margin-top: 8px; padding: 0 8px; border-radius: var(--iv-radius-md); font-size: var(--iv-text-xs); font-weight: 500; color: var(--iv-text-faint); transition: color var(--iv-duration-fast) ease-out; }
.fold-head:focus-visible { outline-offset: -2px; }
.fold-head .ic { transition: transform var(--iv-duration-base) var(--iv-ease-out); }
.fold[data-open] > .fold-head .ic { transform: rotate(90deg); }
.fold > .fold-body { display: none; }
.fold[data-open] > .fold-body { display: flex; animation: fade-in var(--iv-duration-base) var(--iv-ease-out); }
@media (hover: hover) and (pointer: fine) { .fold-head:hover { color: var(--iv-text-muted); } }
.side-empty { padding: 24px 12px; color: var(--iv-text-faint); font-size: var(--iv-text-sm); line-height: var(--iv-text-sm-lh); }

/* Project marks */
.pmark { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: var(--iv-radius-sm); font-size: var(--iv-text-xs); font-weight: 600; background: var(--iv-bg-raised); border: 1px solid var(--iv-border-strong); color: var(--iv-text-muted); text-transform: lowercase; }
.pmark[data-on] { background: color-mix(in srgb, var(--iv-accent) 14%, transparent); border-color: color-mix(in srgb, var(--iv-accent) 45%, transparent); color: var(--iv-accent); }
.dot-hot { width: 6px; height: 6px; border-radius: 50%; background: var(--iv-danger); flex: none; }

/* Project switcher button (Atelier, Flottant) */
.proj-btn { display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px; padding: 0 8px; border-radius: var(--iv-radius-md); font-size: var(--iv-text-lg); font-weight: 600; transition: background-color var(--iv-duration-fast) ease-out, transform 160ms var(--iv-ease-out); }
.proj-btn:active { transform: scale(.97); background: var(--iv-bg-active); }
.proj-btn[aria-expanded="true"] { background: var(--iv-bg-active); }
.proj-btn .ic { color: var(--iv-text-faint); }
.proj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .proj-btn:hover { background: var(--iv-bg-hover); } }

/* Main column */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--iv-bg); }
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.tool-row { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: var(--iv-radius-md); font-size: var(--iv-text-sm); transition: background-color var(--iv-duration-fast) ease-out; }

.tool-ic { color: var(--iv-text-faint); }
.tool-name { font-weight: 500; flex: none; }
.tool-arg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--iv-text-muted); font-size: var(--iv-text-sm); }

.approval { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--iv-radius-md); background: var(--iv-bg-raised); border: 1px solid var(--iv-danger); }

.approval-actions { display: flex; gap: 8px; flex: none; }

.err { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: var(--iv-radius-md); background: var(--iv-danger-subtle); border: 1px solid color-mix(in srgb, var(--iv-danger) 40%, transparent); color: var(--iv-danger); }

/* Menus and dialog */
.menu {
  position: fixed; z-index: 50; min-width: 200px; padding: 4px; border-radius: var(--iv-radius-lg);
  background: var(--iv-bg-raised); border: 1px solid var(--iv-border-strong); box-shadow: var(--iv-shadow-overlay);

}

.backdrop { position: fixed; inset: 0; z-index: 60; background: var(--iv-backdrop); display: grid; place-items: center; animation: fade-in var(--iv-duration-base) var(--iv-ease-out); }
.dialog { width: 420px; max-width: calc(100vw - 48px); padding: 20px; border-radius: var(--iv-radius-lg); background: var(--iv-bg-raised); border: 1px solid var(--iv-border-strong); box-shadow: var(--iv-shadow-overlay); animation: pop-in var(--iv-duration-base) var(--iv-ease-out); }
.dialog h2 { margin: 0 0 4px; font-size: var(--iv-text-xl); line-height: var(--iv-text-xl-lh); font-weight: 600; }
.dialog p { margin: 0 0 20px; color: var(--iv-text-muted); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* Shell: floating sidebar card, main area on the app background */
.shell { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--iv-bg); }
.side-card {
  --ring: var(--iv-bg-card); --side-bg: var(--iv-bg-card);
  position: relative; width: 276px; margin: 8px 0 8px 8px; display: flex; flex-direction: column; min-height: 0;
  border-radius: var(--iv-radius-card); border: 1px solid var(--iv-border); background: var(--iv-bg-card); overflow: hidden;
}
.shell[data-hidden] .side-card { display: none; }
.card-top { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 5px; }
.card-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 44px minmax(0, 1fr); }
.prail { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0 10px; border-right: 1px solid var(--iv-border); min-height: 0; }

.prail-btn { width: 28px; height: 28px; border-radius: var(--iv-radius-md); display: grid; place-items: center; font-size: var(--iv-text-xs); font-weight: 600; background: var(--iv-bg-raised); border: 1px solid var(--iv-border-strong); color: var(--iv-text-muted); transition: transform 160ms var(--iv-ease-out), color var(--iv-duration-fast) ease-out; }
.prail-btn:active { transform: scale(.97); }

@media (hover: hover) and (pointer: fine) { .prail-proj:not([data-on]) .prail-btn:hover { color: var(--iv-text); } }
.rail-badge { position: absolute; top: -5px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--iv-danger); color: var(--iv-bg-subtle); font-size: var(--iv-text-xs); line-height: 16px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--iv-bg-subtle); pointer-events: none; }
.list-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; width: 230px; }
.list-head { display: flex; align-items: center; gap: 8px; height: 36px; flex: none; padding: 0 8px 0 16px; }
.list-head h1 { flex: 1; min-width: 0; margin: 0; font-size: var(--iv-text-lg); line-height: var(--iv-text-lg-lh); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-card .group-label:first-child { padding-top: 4px; }
.pchips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 12px; border-bottom: 1px solid var(--iv-border); }
.pchip { position: relative; height: 28px; min-width: 36px; padding: 0 8px; border-radius: var(--iv-radius-md); display: grid; place-items: center; font-size: var(--iv-text-sm); font-weight: 600; color: var(--iv-text-muted); border: 1px solid transparent; transition: background-color var(--iv-duration-fast) ease-out, color var(--iv-duration-fast) ease-out, transform 160ms var(--iv-ease-out); }
.pchip:active { transform: scale(.97); }

@media (hover: hover) and (pointer: fine) { .pchip:not([aria-current="true"]):hover { background: var(--iv-bg-hover); color: var(--iv-text); } }
.band-head { height: 44px; padding: 8px 8px 0 16px; }
.sess-head { display: flex; align-items: center; gap: 12px; height: 36px; flex: none; width: 100%; max-width: calc(var(--iv-content-width) + 48px); margin: 4px auto 0; padding: 0 24px; min-width: 0; }
.sess-title { font-weight: 600; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hchip { display: inline-flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 0; height: 24px; padding: 0 8px; border-radius: var(--iv-radius-md); background: var(--iv-bg-hover); color: var(--iv-text-muted); font-size: var(--iv-text-sm); white-space: nowrap; }
.hchip .faint { color: var(--iv-text-faint); }
.hchip .br { overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 220px; font-size: var(--iv-text-xs); }
.menu-item[aria-disabled="true"] { opacity: .45; }
.menu-item[aria-disabled="true"]:focus { background: none; }
.menu-head { display: flex; align-items: center; gap: 6px; }
.menu-note { padding: 4px 8px 6px; max-width: 260px; font-size: var(--iv-text-xs); line-height: var(--iv-text-xs-lh); color: var(--iv-text-faint); }
.composer-bar .hsvg { margin-right: 2px; }

/* Card header, sidebar views */
.side-card { width: 300px; }
.list-col { width: 100%; }
.card-top .ct-nav { display: flex; gap: 2px; margin-left: 10px; }
.card-top .grow { flex: 1; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--iv-radius-md); background: var(--iv-bg-hover); }
.seg button { width: 24px; height: 20px; display: grid; place-items: center; border-radius: var(--iv-radius-sm); color: var(--iv-text-faint); transition: background-color var(--iv-duration-fast) ease-out, color var(--iv-duration-fast) ease-out, transform 160ms var(--iv-ease-out); }
.seg button:active { transform: scale(.97); }

@media (hover: hover) and (pointer: fine) { .seg button:hover { color: var(--iv-text); } }

/* Project identity */
:root[data-theme="forest-dark"] { --hue-0: #8fbf98; --hue-1: #8fadd6; --hue-2: #d2b273; --hue-3: #bc98cc; --hue-4: #cf9d80; --hue-5: #7fc0ba; --bubble: color-mix(in srgb, var(--iv-accent) 14%, var(--iv-bg-raised)); }
:root[data-theme="forest-light"] { --hue-0: #3f7a4c; --hue-1: #3d6496; --hue-2: #87661a; --hue-3: #76508e; --hue-4: #93593a; --hue-5: #2f7570; --bubble: color-mix(in srgb, var(--iv-accent) 16%, var(--iv-bg-raised)); }
.pbtn { position: relative; width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; color: var(--iv-text-muted); transition: background-color var(--iv-duration-fast) ease-out, transform 160ms var(--iv-ease-out); }

.id-pixel .pbtn[aria-current="true"], .id-glyphe .pbtn[aria-current="true"] { background: var(--iv-bg-raised); box-shadow: 0 0 0 1px var(--iv-border), 0 1px 2px rgba(0, 0, 0, .12); }
.pix { display: block; flex: none; shape-rendering: crispEdges; }
.pastille { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 6px; font-size: var(--iv-text-sm); font-weight: 600; line-height: 1; text-transform: uppercase; background: color-mix(in srgb, var(--h) 24%, var(--iv-bg-raised)); color: var(--h); transition: box-shadow var(--iv-duration-fast) ease-out; }

.glyph { display: grid; place-items: center; flex: none; color: var(--iv-text-muted); }

.prail { gap: 6px; }
.prail .rail-badge, .strip-item .rail-badge { top: -4px; right: -2px; }

/* Strip view */
.strip-head { display: flex; align-items: center; gap: 4px; padding: 0 8px 4px; flex: none; }

.strip-scroll::-webkit-scrollbar { display: none; }

/* Conversation: user bubble, action sheet */
.tx .user-msg { background: var(--bubble); border: 0; border-radius: 12px 12px 4px 12px; padding: 10px 12px; color: var(--iv-text); }
.record { display: flex; align-items: center; gap: 8px; min-height: 24px; padding: 0 8px; font-size: var(--iv-text-sm); color: var(--iv-text-muted); }
.record .mono { font-size: var(--iv-text-sm); overflow-wrap: anywhere; }
.sheet { background: var(--iv-bg-raised); border: 1px solid var(--iv-border-strong); border-bottom: 0; border-radius: var(--iv-radius-lg) var(--iv-radius-lg) 0 0; padding: 12px 12px 10px; position: relative; }
.sheet-head { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0 0 8px 4px; }
.sheet[data-kind="approval"] { border: 1px dashed color-mix(in srgb, var(--iv-danger) 60%, transparent); border-bottom: 0; }
.composer-wrap[data-sheet="approval"] .composer { border-top-style: dashed; border-top-color: color-mix(in srgb, var(--iv-danger) 60%, transparent); }
.sheet-kind { flex: none; font-weight: 500; }
.sheet[data-kind="approval"] .sheet-kind { color: var(--iv-danger); }
.sheet[data-kind="question"] .sheet-head .ic { flex: none; color: var(--iv-text-muted); }
.sheet-inline { min-width: 0; font-family: var(--iv-font-mono); font-size: var(--iv-text-sm); font-weight: 400; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sheet[data-kind="approval"] .sheet-head { align-items: baseline; }
.sheet .sheet-code { margin: 0 0 8px; font-family: var(--iv-font-mono); font-size: var(--iv-text-sm); line-height: 20px; background: var(--iv-bg-subtle); border: 1px solid var(--iv-border); border-radius: var(--iv-radius-md); padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.q-opt .q-key { margin-left: auto; font-size: var(--iv-text-xs); color: var(--iv-text-faint); }
.q-opt .q-text code { font-family: var(--iv-font-mono); font-size: .92em; background: var(--iv-bg-active); border-radius: var(--iv-radius-sm); padding: 1px 4px; }
.mark[data-status="background"] > i { width: 8px; height: 8px; border-radius: 50%; }
.bg-badge { display: inline-flex; align-items: center; gap: 2px; flex: none; color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-variant-numeric: tabular-nums; }
.sl-bg { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 6px; margin: 0 -6px; border-radius: var(--iv-radius-sm); color: var(--iv-text-muted); }
.sl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--iv-status-working); flex: none; }
@media (hover: hover) and (pointer: fine) { .sl-bg:hover { background: var(--iv-bg-hover); color: var(--iv-text); } }
.mi-sub { margin-left: auto; padding-left: 12px; font-size: var(--iv-text-xs); color: var(--iv-text-faint); font-variant-numeric: tabular-nums; }
.menu-item .mi-label.mono { font-family: var(--iv-font-mono); font-size: var(--iv-text-sm); }
.sheet.enter { animation: sheet-in 200ms var(--iv-ease-out) both; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(8px); } }
.sheet.leaving { opacity: 0; transition: opacity 150ms ease-out; }
.composer-wrap[data-sheet] .composer { border-top-left-radius: 0; border-top-right-radius: 0; }
.sheet-row { display: flex; align-items: center; gap: 12px; }
.sheet-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sheet-label { font-weight: 500; }
.sheet-cmd { font-family: var(--iv-font-mono); font-size: var(--iv-text-sm); overflow-wrap: anywhere; }
.q-title { font-weight: 500; margin: 0 0 8px 4px; }

.q-opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 6px 8px; border-radius: var(--iv-radius-md); transition: background-color var(--iv-duration-fast) ease-out; }

function tabs(p) {
  const list = S.sessions.filter((s) => s.project === p.id);
  return `<div class="topbar"><div class="tabs" role="tablist">${list.map((s) => {
    const on = S.active[p.id] === s.id;
    return `<div class="tab" ${on ? 'data-active' : ''}><button class="tab-btn" role="tab" aria-selected="${on}" data-act="open" data-id="${s.id}">${mark(s)}<span class="tab-title">${esc(s.title)}</span></button></div>`;
  }).join('')}</div><button class="btn btn-ghost btn-sm btn-icon tab-add" data-act="new-session" aria-label="New session" title="New session">${ic('plus', 16)}</button></div>`;
}

function itemHTML(it) {
  const enter = S.fresh.has(it.id) ? ' enter' : '';
  switch (it.t) {
    case 'user': return `<div class="user-msg${enter}" ${it.pending ? 'data-pending' : ''}>${esc(it.text)}</div>`;
    case 'md': return `<div class="msg${enter}"><div class="md">${it.html}</div></div>`;
    case 'prep': return `<div class="record${enter}">${spinner(14)}<span>Preparing worktree…</span></div>`;
    case 'wf': return `<div class="record${enter}">${ic('worktree', 14)}<span>Started in ${it.existing ? 'the' : 'a new'} worktree on <b class="mono-t">${esc(it.branch)}</b></span><span class="path" title="${esc(it.path)}">${esc(it.path)}</span></div>`;
    case 'git-error': return `<div class="err-block${enter}" role="alert"><div class="err-title">${ic('alert', 14)}Git could not create the worktree. Send again, or switch to Current checkout.</div><pre>${esc(it.output)}</pre></div>`;
  }
  return '';
}

function statusLine(s, p) {
  let where;
  if (!p.git) where = `<span class="sl-item">${ic('folder', 12)}<span>${esc(p.path)}</span></span>`;
  else if (choosing(s)) {
    where = `<button class="sl-pick" data-act="menu" data-fk="wf-trigger" data-kind="${s.kind}" aria-haspopup="menu" aria-expanded="${S.menu}">${ic(OPTS[s.kind].icon, 12)}<span>${OPTS[s.kind].label}</span>${ic('chevDown', 10, 'chev')}</button>
      <span class="sl-item">${ic('branch', 12)}${s.kind === 'worktree' ? `<span>New branch from <span class="mono-t">${esc(p.git.base)}</span></span>` : `<span class="mono-t">${esc(s.kind === 'existing' ? s.existing : p.git.checkoutBranch)}</span>`}</span>`;
  } else {
    const label = s.status === 'preparing' ? 'Preparing worktree…' : s.kind === 'checkout' ? 'Current checkout' : 'Worktree';
    where = `<span class="sl-item">${folderIcon(s)}<span>${label}</span></span>
      <span class="sl-item">${ic('branch', 12)}<span class="mono-t">${esc(s.branch)}</span></span>`;
  }
  const usage = s.started ? `<span class="sl-item num">${s.tokens} tokens</span><span class="sl-item num">${s.cost}</span>` : '';
  return `<div class="statusline">${where}<span class="sl-grow"></span>${usage}</div>`;
}
function menu(s, p) {
  if (!S.menu || !choosing(s)) return '';
  const item = (value, icon, label, on, sub = '') => `<button class="menu-item" role="menuitemradio" aria-checked="${on}" data-act="kind" data-value="${esc(value)}" data-fk="kind-${esc(value)}">${ic(icon, 14)}<span class="mi-label ${value.startsWith('existing:') ? 'mono' : ''}">${esc(label)}</span>${sub ? `<span class="mi-sub" title="${esc(sub)}">${esc(sub)}</span>` : ''}<span class="mi-check">${on ? ic('check', 14) : ''}</span></button>`;
  const wts = worktreesOf(p);
  return `<div class="menu wf-menu ${S.menuOpening ? 'opening' : ''}" role="menu" aria-label="Working folder">
    ${item('checkout', 'folder', 'Current checkout', s.kind === 'checkout')}
    ${item('worktree', 'plus', 'New worktree', s.kind === 'worktree')}
    ${wts.length ? `<div class="menu-sep" role="separator"></div><div class="menu-head">Existing worktrees</div><div class="wf-list">${wts.map((w) => item('existing:' + w.branch, 'worktree', w.branch, s.kind === 'existing' && s.existing === w.branch, w.usedBy ?? '')).join('')}</div>` : ''}
  </div>`;
}
function composer(s, p) {
  const busy = s.status === 'preparing' || s.status === 'working';
  const ph = fresh(s) ? 'Describe the task' : 'Message Claude';
  return `<div class="composer-wrap"><div class="composer">
      <textarea rows="1" placeholder="${ph}" aria-label="Message Claude" data-input="draft" data-fk="composer">${esc(s.draft)}</textarea>
      <div class="composer-bar">
        <button class="btn btn-ghost btn-sm" tabindex="-1"><svg class="hsvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => { const r = (a * Math.PI) / 180; return `<path d="M${(12 + 3 * Math.cos(r)).toFixed(2)} ${(12 + 3 * Math.sin(r)).toFixed(2)}L${(12 + 9.5 * Math.cos(r)).toFixed(2)} ${(12 + 9.5 * Math.sin(r)).toFixed(2)}"/>`; }).join('')}</svg>Sonnet 5.5${ic('chevDown', 12)}</button>
        <span class="grow"></span>
        <button class="btn btn-primary btn-icon" data-act="send" aria-label="Send" title="Send (Enter)" ${s.draft.trim() && !busy ? '' : 'disabled'}>${ic('arrowUp', 16)}</button>
      </div>
    </div>${statusLine(s, p)}</div>`;
}

function app() {
  const p = proj(), s = activeSess();
  let main;
  if (!s) main = `<div class="content"><div class="empty"><div class="empty-title">No open session</div></div></div>`;
  else if (fresh(s)) main = `<div class="content"><div class="hero"><div class="hero-title">What should we work on in ${esc(p.name)}?</div>${composer(s, p)}</div></div>`;
  else main = `<div class="content"><div class="tx-scroll"><div class="tx">${s.items.map(itemHTML).join('')}</div></div>${composer(s, p)}</div>`;
  return `<div class="app shell id-pastille">${sidebar(p)}<main class="main">${tabs(p)}${main}</main>${s ? menu(s, p) : ''}</div>`;
}

function render(glide = false) {
  const a = document.activeElement;
  let fk = S.focus, sel = null;
  if (!fk && a && stage.contains(a) && a.dataset.fk) fk = a.dataset.fk;
  if (!S.focus && a && a.dataset.fk === fk && 'selectionStart' in a) { try { sel = [a.selectionStart, a.selectionEnd]; } catch { sel = null; } }
  const before = glide && !reduced() ? stage.querySelector('.composer-wrap')?.getBoundingClientRect() : null;
  stage.innerHTML = app();
  afterRender(fk, sel);
  // The composer slides from the middle to the bottom on the first message.
  const wrap = stage.querySelector('.composer-wrap');
  if (before && wrap) {
    const dy = before.top - wrap.getBoundingClientRect().top;
    wrap.style.transform = `translateY(${dy}px)`;
    wrap.getBoundingClientRect();
    wrap.classList.add('gliding');
    wrap.style.transform = '';
    wrap.addEventListener('transitionend', () => wrap.classList.remove('gliding'), { once: true });
  }
}
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px'; }
function afterRender(fk, sel) {
  stage.querySelectorAll('textarea').forEach(autosize);
  const tx = stage.querySelector('.tx-scroll');
  if (tx) tx.scrollTop = tx.scrollHeight;
  const m = stage.querySelector('.wf-menu');
  if (m) {
    const t = stage.querySelector('[data-fk="wf-trigger"]').getBoundingClientRect();
    const down = t.bottom + m.offsetHeight + 8 < innerHeight;
    m.style.left = Math.min(t.left - 4, innerWidth - m.offsetWidth - 8) + 'px';
    if (down) { m.style.top = t.bottom + 4 + 'px'; m.style.transformOrigin = 'top left'; }
    else { m.style.bottom = innerHeight - t.top + 4 + 'px'; m.style.transformOrigin = 'bottom left'; }
    m.style.visibility = 'visible';
  }
  if (fk) {
    const el = stage.querySelector(`[data-fk="${fk}"]`);
    if (el) {
      el.focus({ preventScroll: true });
      if (el.tagName === 'TEXTAREA') { const [x, y] = sel ?? [el.value.length, el.value.length]; el.setSelectionRange(x, y); }
    }
  }
  S.focus = null;
  S.menuOpening = false;
  S.fresh.clear();
}

stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.wf-menu') && !(el && el.dataset.act === 'menu')) { S.menu = false; if (!el) return render(); }
  if (!el || el.disabled) return;
  const s = activeSess();
  switch (el.dataset.act) {
    case 'open': S.active[S.projectId] = el.dataset.id; S.focus = 'composer'; break;
    case 'project': S.projectId = el.dataset.value; S.menu = false; S.focus = 'composer'; break;
    case 'new-session': newSession(); break;
    case 'send': return send();
    case 'menu': S.menu = !S.menu; S.menuOpening = S.menu; S.focus = S.menu ? `kind-${s.kind === 'existing' ? 'existing:' + s.existing : s.kind}` : 'wf-trigger'; break;
    case 'kind': [s.kind, s.existing] = el.dataset.value.split(/:(.*)/); if (s.status === 'failed') s.status = 'idle'; S.menu = false; S.focus = 'composer'; break;
    default: return;
  }
  render();
});
stage.addEventListener('input', (e) => {
  const s = activeSess();
  if (e.target.dataset.input !== 'draft') return;
  s.draft = e.target.value;
  autosize(e.target);
  stage.querySelector('[data-act="send"]').disabled = !s.draft.trim() || s.status === 'preparing' || s.status === 'working';
});
stage.addEventListener('keydown', (e) => {
  if (S.menu) {
    const items = [...stage.querySelectorAll('.wf-menu .menu-item')];
    let i = items.indexOf(document.activeElement);
    if (i < 0 && e.key === 'ArrowUp') i = 0;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); items[(i + (e.key === 'ArrowUp' ? items.length - 1 : 1)) % items.length].focus(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.stopPropagation(); return; }
    if (e.key === 'Escape') { e.preventDefault(); S.menu = false; S.focus = 'wf-trigger'; return render(); }
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.dataset.input === 'draft') { e.preventDefault(); send(); }
}, true);
document.addEventListener('mousedown', (e) => { if (S.menu && !stage.contains(e.target)) { S.menu = false; render(); } });
// Demo only: F makes the next worktree fail, as if offline.
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'f' || e.key === 'F') S.offline = true;
});
</script>
</body>
</html>
