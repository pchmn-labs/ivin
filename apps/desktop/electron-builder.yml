appId: dev.pchmn.ivin
productName: ivin
executableName: ivin
directories:
  output: release
files:
  - from: dist
    to: .
    filter: ["main.js", "preload.cjs"]
  - from: ../server/dist
    to: server
  - from: ../../packages/ui/dist
    to: renderer
  - package.json
extraResources:
  - from: ../cli/dist
    to: cli
# Worker threads cannot load from the asar; `webp-encoder.ts` points them here.
asarUnpack:
  - server/webp-worker.js
  - server/webp_enc*.js
  - server/wasm/**
extraMetadata:
  main: main.js
mac:
  target:
    - target: dir
      arch: arm64
  identity: null
linux:
  target:
    - target: dir
      arch: x64
