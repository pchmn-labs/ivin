appId: dev.pchmn.ivin
productName: ivin
executableName: ivin
directories:
  output: release
files:
  - from: dist
    to: .
    filter: ["main.js", "preload.cjs"]
  - from: ../server/dist
    to: server
  - from: ../../packages/ui/dist
    to: renderer
  - package.json
extraResources:
  - from: ../cli/dist
    to: cli
  - from: ../server/skills
    to: skills
  - from: ../../plugins
    to: plugins
    filter: ["**/*", "!**/*.ts", "!**/*.tsx"]
# Worker threads, native bindings and child processes cannot load from the asar; `webp-encoder.ts`, Rolldown's loader and `pnpm.ts` point here.
asarUnpack:
  - server/webp-worker.js
  - server/webp_enc*.js
  - server/wasm/**
  - server/native/**
  - server/pnpm/**
extraMetadata:
  main: main.js
mac:
  target:
    - target: dir
      arch: arm64
  identity: null
linux:
  target:
    - target: dir
      arch: x64
