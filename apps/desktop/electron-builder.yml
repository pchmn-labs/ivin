appId: dev.pchmn.ivin
productName: ivin
executableName: ivin
directories:
  output: release
files:
  - from: dist
    to: .
    filter: ["main.js", "preload.cjs"]
  - from: ../server/dist
    to: server
    filter: ["**/*", "!pnpm/**", "!plugin-host.js", "!plugin-tools/**", "!ts-check-worker.js"]
  - from: ../../packages/ui/dist
    to: renderer
  - package.json
extraResources:
  - from: ../cli/dist
    to: cli
  - from: ../server/dist/plugin-host.js
    to: plugin-host/plugin-host.js
  - from: ../server/skills
    to: skills
  - from: ../server/dist/plugin-tools
    to: plugin-tools
  - from: ../server/dist/ts-check-worker.js
    to: plugin-tools/ts-check-worker.js
  - from: ../server/dist/pnpm
    to: pnpm
  - from: ../../plugins
    to: plugins
    filter: ["**/*", "!**/*.ts", "!**/*.tsx"]
# Worker threads and native bindings cannot load from the asar; `webp-encoder.ts` and Rolldown's loader point here.
asarUnpack:
  - server/webp-worker.js
  - server/webp_enc*.js
  - server/wasm/**
  - server/native/**
extraMetadata:
  main: main.js
mac:
  target:
    - target: dir
      arch: arm64
  identity: null
linux:
  target:
    - target: dir
      arch: x64
