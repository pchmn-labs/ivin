<!doctype html>
<html lang="en" data-theme="forest-dark">
<head>
<meta charset="utf-8" />
<title>#115 — Files and Changes tabs, file and diff sub-views</title>
<link rel="stylesheet" href="../../packages/ui/src/core/theme/tokens.css" />
<link rel="stylesheet" href="../../packages/ui/src/core/theme/base.css" />
<style>
/* ---------- Tokens this spec would add (proposals) ---------- */
:root {
  --iv-git-modified: #d2b273;
  --iv-git-added: #8fc98f;
  --iv-git-untracked: #7fc0ba;
  --iv-git-deleted: #e0806c;
  --iv-git-ignored: color-mix(in srgb, var(--iv-text-faint) 70%, transparent);
  --iv-diff-added-bg: rgba(143, 201, 143, 0.1);
  --iv-diff-added-mark: rgba(143, 201, 143, 0.22);
  --iv-diff-deleted-bg: rgba(224, 128, 108, 0.1);
  --iv-diff-deleted-mark: rgba(224, 128, 108, 0.22);
  --iv-syntax-keyword: #bc98cc;
  --iv-syntax-string: #a9d9a0;
  --iv-syntax-comment: #6f8076;
  --iv-syntax-number: #cf9d80;
  --iv-syntax-type: #7fc0ba;
  --iv-syntax-function: #8fadd6;
  --iv-subtab-height: 28px;
}

body { overflow: hidden; }
button { color: inherit; font: inherit; }
svg { flex: none; display: block; }
.mono { font-family: var(--iv-font-mono); }
.faint { color: var(--iv-text-faint); }
.muted { color: var(--iv-text-muted); }
.tabular { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Window shell (matches the shipped app) ---------- */
.app { display: grid; grid-template-columns: var(--iv-card-width) 1fr; height: 100vh; }
.card { display: flex; flex-direction: column; margin: 8px 0 8px 8px; border: 1px solid var(--iv-border); border-radius: var(--iv-radius-card); background: var(--iv-bg-card); overflow: hidden; min-height: 0; }
.card-top { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px 0 var(--iv-traffic-lights-width); flex: none; }
.lights { position: fixed; top: 22px; left: 23px; display: flex; gap: 8px; z-index: 5; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--iv-border-strong); }
.spacer { flex: 1; }
.card-body { display: flex; flex: 1; min-height: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 8px; width: var(--iv-rail-width); padding: 4px 0 10px; border-right: 1px solid var(--iv-border); flex: none; }
.rail-btn { position: relative; display: grid; place-items: center; width: var(--iv-rail-button-size); height: var(--iv-rail-button-size); border: 0; border-radius: var(--iv-radius-rail-button); background: transparent; cursor: pointer; }
.rail-btn[data-selected] { background: var(--iv-bg-raised); box-shadow: 0 0 0 1px var(--iv-border), var(--iv-shadow-raised); }
.rail-btn:hover:not([data-selected]) { background: var(--iv-bg-hover); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--iv-accent); margin-top: auto; }
.column { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.list-head { display: flex; align-items: center; gap: 8px; height: var(--iv-list-head-height); padding: 0 8px 0 12px; flex: none; }
.list-head b { flex: 1; min-width: 0; font-size: var(--iv-text-lg); font-weight: var(--iv-weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
.caption { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-weight: var(--iv-weight-medium); }
.caption .count { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; height: var(--iv-row-height); padding: 0 8px; border-radius: var(--iv-radius-md); cursor: pointer; white-space: nowrap; }
.row + .row { margin-top: 2px; }
.row:hover { background: var(--iv-bg-hover); }
.row[data-selected] { background: var(--iv-bg-active); font-weight: var(--iv-weight-medium); }
.row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-variant-numeric: tabular-nums; }
.claude { color: #d97757; }
.mark { position: relative; display: inline-flex; }
.mark .ov { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--iv-accent); border-right-color: transparent; box-shadow: 0 0 0 2px var(--iv-bg-card); background: var(--iv-bg-card); animation: spin var(--iv-duration-spin) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.working { flex: none; border-top: 1px solid var(--iv-border); padding: 8px; }
.working .caption { padding: 0 4px; height: 20px; }

.icon-btn { display: inline-grid; place-items: center; width: var(--iv-control-sm); height: var(--iv-control-sm); padding: 0; border: 0; border-radius: var(--iv-radius-md); background: transparent; color: var(--iv-text-muted); cursor: pointer; transition: background-color var(--iv-duration-fast) ease-out, color var(--iv-duration-fast) ease-out, transform var(--iv-duration-press) var(--iv-ease-out); }
.icon-btn:hover { background: var(--iv-bg-hover); color: var(--iv-text); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn[aria-pressed="true"] { background: var(--iv-bg-active); color: var(--iv-text); }
.icon-btn.md { width: var(--iv-control-md); height: var(--iv-control-md); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.titlebar { display: flex; align-items: center; gap: 4px; height: 40px; margin-top: 8px; padding: 0 12px; flex: none; }
.tab { display: flex; align-items: center; gap: 8px; width: var(--iv-tab-width); min-width: var(--iv-tab-min-width); height: var(--iv-tab-height); padding: 0 var(--iv-tab-padding); border-radius: var(--iv-radius-tab); color: var(--iv-text-muted); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); white-space: nowrap; overflow: hidden; cursor: pointer; flex: 0 1 auto; }
.tab:hover { background: var(--iv-bg-hover); }
.tab[data-selected] { background: var(--iv-bg-raised); box-shadow: 0 0 0 1px var(--iv-border); color: var(--iv-text); }
.tab span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.content { flex: 1; min-height: 0; display: flex; }

/* ---------- Chat ---------- */
.chat { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.transcript { flex: 1; overflow-y: auto; }
.tcol { max-width: var(--iv-content-width); margin: 0 auto; padding: var(--iv-space-4) var(--iv-space-6); }
.item { padding: var(--iv-space-2) 0; }
.item p { margin: 0 0 8px; }
.item p:last-child { margin: 0; }
.bubble { padding: 10px var(--iv-space-3); border-radius: var(--iv-radius-card) var(--iv-radius-card) var(--iv-radius-sm) var(--iv-radius-card); background: var(--iv-bubble); }
.tool { display: flex; gap: 8px; align-items: center; color: var(--iv-text-muted); font-size: var(--iv-text-sm); }
.tool b { font-weight: var(--iv-weight-medium); color: var(--iv-text); }
.tool code { font-family: var(--iv-font-mono); color: var(--iv-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inline-code { font-family: var(--iv-font-mono); font-size: 0.92em; padding: 1px 4px; border-radius: var(--iv-radius-sm); background: var(--iv-bg-raised); }
.composer { width: 100%; max-width: var(--iv-content-width); margin: 0 auto; padding: 0 var(--iv-space-6) var(--iv-space-3); }
.surface { display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid var(--iv-border-strong); border-radius: var(--iv-radius-lg); background: var(--iv-bg-raised); }
.surface textarea { width: 100%; min-height: 40px; resize: none; padding: 4px 8px; border: 0; outline: none; background: transparent; color: var(--iv-text); font: inherit; }
.surface textarea::placeholder { color: var(--iv-text-faint); }
.surface-row { display: flex; align-items: center; justify-content: space-between; color: var(--iv-text-muted); font-size: var(--iv-text-sm); padding: 0 4px; }
.send { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--iv-radius-md); background: var(--iv-accent); color: var(--iv-accent-contrast); opacity: var(--iv-opacity-disabled); }
.statusline { display: flex; align-items: center; gap: 12px; height: 24px; padding: 0 8px; color: var(--iv-text-faint); font-size: var(--iv-text-xs); }
.chat.narrow .tcol, .chat.narrow .composer { padding-left: var(--iv-space-4); padding-right: var(--iv-space-4); }

/* ---------- Files tree ---------- */
.tree-tools { display: flex; align-items: center; gap: 4px; padding: 0 0 6px; }
.filter { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; height: var(--iv-control-sm); padding: 0 8px; border: 1px solid var(--iv-border); border-radius: var(--iv-radius-md); background: var(--iv-bg-subtle); color: var(--iv-text-faint); }
.filter:focus-within { border-color: var(--iv-focus-ring); }
.filter input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--iv-text); font-size: var(--iv-text-sm); }
.filter input::placeholder { color: var(--iv-text-faint); }
.folder-line { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; color: var(--iv-text-faint); font-size: var(--iv-text-xs); white-space: nowrap; overflow: hidden; }
.folder-line .mono { overflow: hidden; text-overflow: ellipsis; }
.node { display: flex; align-items: center; gap: 6px; height: 24px; padding-right: 8px; border-radius: var(--iv-radius-sm); font-size: var(--iv-text-md); cursor: pointer; white-space: nowrap; color: var(--iv-text); }
.node:hover { background: var(--iv-bg-hover); }
.node[data-selected] { background: var(--iv-bg-active); }
.node .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.node .chev { color: var(--iv-text-faint); transition: transform var(--iv-duration-fast) var(--iv-ease-out); }
.node[aria-expanded="true"] .chev { transform: rotate(90deg); }
.node .ficon { color: var(--iv-text-faint); }
.node[data-status="M"] .name { color: var(--iv-git-modified); }
.node[data-status="A"] .name { color: var(--iv-git-added); }
.node[data-status="U"] .name { color: var(--iv-git-untracked); }
.node[data-status="ignored"] .name { color: var(--iv-git-ignored); }
.node .st { width: 12px; text-align: center; font-family: var(--iv-font-mono); font-size: var(--iv-text-xs); }
.node[data-status="M"] .st { color: var(--iv-git-modified); }
.node[data-status="A"] .st { color: var(--iv-git-added); }
.node[data-status="U"] .st { color: var(--iv-git-untracked); }
.node .dotst { width: 5px; height: 5px; border-radius: 50%; margin-right: 4px; }
.node[data-status="M"] .dotst { background: var(--iv-git-modified); }
.node[data-status="A"] .dotst { background: var(--iv-git-added); }
.node[data-status="U"] .dotst { background: var(--iv-git-untracked); }
.hl { color: var(--iv-accent); font-weight: var(--iv-weight-semibold); }
.empty { padding: 16px 8px; color: var(--iv-text-faint); font-size: var(--iv-text-sm); }

/* ---------- Changes ---------- */
.change { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 4px 0 8px; border-radius: var(--iv-radius-sm); cursor: pointer; white-space: nowrap; }
.change:hover { background: var(--iv-bg-hover); }
.change[data-selected] { background: var(--iv-bg-active); }
.change .name { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.change .dir { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--iv-text-faint); font-size: var(--iv-text-xs); direction: rtl; text-align: left; }
.change .st { width: 14px; text-align: center; font-family: var(--iv-font-mono); font-size: var(--iv-text-xs); }
.change[data-status="M"] .st { color: var(--iv-git-modified); }
.change[data-status="A"] .st { color: var(--iv-git-added); }
.change[data-status="U"] .st { color: var(--iv-git-untracked); }
.change[data-status="D"] .st { color: var(--iv-git-deleted); }
.change[data-status="D"] .name { text-decoration: line-through; color: var(--iv-text-muted); }
.change .counts { font-family: var(--iv-font-mono); font-size: var(--iv-text-xs); font-variant-numeric: tabular-nums; }
.plus { color: var(--iv-git-added); }
.minus { color: var(--iv-git-deleted); }
.change .act { display: none; }
.change:hover .act, .change:focus-within .act, .change[data-selected] .act { display: inline-grid; }
.change:hover .counts, .change[data-selected] .counts { display: none; }
.group-head { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-weight: var(--iv-weight-medium); cursor: pointer; }
.group-head .chev { transition: transform var(--iv-duration-fast) var(--iv-ease-out); }
.group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.group-head .base { font-weight: var(--iv-weight-regular); font-family: var(--iv-font-mono); }
.row-error { display: flex; gap: 6px; padding: 4px 8px 6px 30px; color: var(--iv-danger); font-size: var(--iv-text-xs); }

/* ---------- Sidebar tabs: 1 · Underlined (the shipped Tabs component) ---------- */
.utabs { display: flex; gap: 16px; height: 32px; margin: 0 12px 6px; border-bottom: 1px solid var(--iv-border); flex: none; }
.utab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: var(--iv-text-muted); font-size: var(--iv-text-md); font-weight: var(--iv-weight-medium); cursor: pointer; }
.utab:hover { color: var(--iv-text); }
.utab[aria-selected="true"] { color: var(--iv-text); }
.utab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: var(--iv-line-bold); background: var(--iv-accent); border-radius: 1px; }
.utab .count { color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-variant-numeric: tabular-nums; }

/* ---------- Sidebar tabs: 2 · Icons in the card's top row ---------- */
.itabs { display: flex; gap: 2px; margin-left: 6px; padding-left: 6px; border-left: 1px solid var(--iv-border); }
.itab { position: relative; }
.itab .badge { position: absolute; top: -3px; right: -5px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: var(--iv-radius-pill); background: var(--iv-bg-raised); box-shadow: 0 0 0 1px var(--iv-border-strong); color: var(--iv-text-muted); font-size: 10px; line-height: 14px; font-weight: var(--iv-weight-semibold); font-variant-numeric: tabular-nums; text-align: center; }
.panel-head { display: flex; align-items: center; gap: 8px; height: var(--iv-list-head-height); padding: 0 8px 0 12px; flex: none; }
.panel-head b { font-size: var(--iv-text-lg); font-weight: var(--iv-weight-semibold); }

/* ---------- Sidebar tabs: 3 · Segmented control on top of the column ---------- */
.seg { display: flex; gap: 2px; margin: 4px 8px 4px; padding: 2px; border-radius: var(--iv-radius-md); background: var(--iv-bg-subtle); box-shadow: inset 0 0 0 1px var(--iv-border); flex: none; }
.seg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 24px; border: 0; border-radius: var(--iv-radius-sm); background: transparent; color: var(--iv-text-muted); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); cursor: pointer; transition: background-color var(--iv-duration-fast) ease-out, color var(--iv-duration-fast) ease-out; }
.seg button:hover { color: var(--iv-text); }
.seg button[aria-selected="true"] { background: var(--iv-bg-raised); color: var(--iv-text); box-shadow: 0 0 0 1px var(--iv-border), var(--iv-shadow-raised); }
.seg .count { color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-variant-numeric: tabular-nums; }

/* ---------- Sub-views: file and diff ---------- */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--iv-bg-subtle); }
.side .pane { flex: 1.15; border-left: 1px solid var(--iv-border); }
.side .chat { flex: 1; }
.full .pane { flex: 1; border-top: 1px solid var(--iv-border); }
.pane-head { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 8px 0 4px; border-bottom: 1px solid var(--iv-border); background: var(--iv-bg); flex: none; }
.ptabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.ptab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; border: 0; background: transparent; color: var(--iv-text-muted); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); white-space: nowrap; cursor: pointer; }
.ptab:hover { color: var(--iv-text); }
.ptab[aria-selected="true"] { color: var(--iv-text); }
.ptab[aria-selected="true"]::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: -1px; height: var(--iv-line-bold); background: var(--iv-accent); border-radius: 1px; }
.close-x { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--iv-radius-sm); color: var(--iv-text-faint); }
.close-x:hover { background: var(--iv-bg-hover); color: var(--iv-text); }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--iv-text-muted); margin: 0 5px; }
.has-dirty:hover .dirty, .has-dirty:focus-within .dirty { display: none; }
.has-dirty .close-x { display: none; }
.has-dirty:hover .close-x, .has-dirty:focus-within .close-x { display: inline-grid; }
.ptab-icon { display: inline-flex; color: var(--iv-text-faint); }
.ptab[aria-selected="true"] .ptab-icon { color: var(--iv-text-muted); }
.kind-diff { color: var(--iv-text-faint); font-size: var(--iv-text-xs); font-weight: var(--iv-weight-regular); }

.subtabs { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; flex: none; }
.subtab { display: flex; align-items: center; gap: 6px; max-width: 220px; height: var(--iv-subtab-height); padding: 0 4px 0 10px; border: 0; border-radius: var(--iv-radius-md); background: transparent; color: var(--iv-text-muted); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); white-space: nowrap; cursor: pointer; }
.subtab > span:first-of-type { overflow: hidden; text-overflow: ellipsis; }
.subtab:hover { background: var(--iv-bg-hover); }
.subtab[aria-selected="true"] { background: var(--iv-bg-active); color: var(--iv-text); }
.subtab.session { padding-right: 10px; }
.subtab-sep { width: 1px; height: 16px; background: var(--iv-border); margin: 0 4px; }
.mode-btn { display: inline-flex; align-items: center; gap: 6px; height: var(--iv-control-sm); padding: 0 8px; border: 0; border-radius: var(--iv-radius-md); background: transparent; color: var(--iv-text-muted); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); cursor: pointer; white-space: nowrap; }
.mode-btn:hover { background: var(--iv-bg-hover); color: var(--iv-text); }
.kbd { font-family: var(--iv-font-mono); color: var(--iv-text-faint); font-size: var(--iv-text-xs); }

.crumbs { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; padding-left: 8px; font-size: var(--iv-text-sm); white-space: nowrap; overflow: hidden; }
.crumbs .seg-dir { color: var(--iv-text-faint); }
.crumbs .sep { color: var(--iv-border-strong); }
.crumbs b { font-weight: var(--iv-weight-medium); }
.anchor { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 300px; padding: 4px; border: 1px solid var(--iv-border-strong); border-radius: var(--iv-radius-lg); background: var(--iv-bg-raised); box-shadow: var(--iv-shadow-overlay); transform-origin: top right; animation: pop 120ms var(--iv-ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(0.97); } }
.menu-item { display: flex; align-items: center; gap: 8px; height: var(--iv-control-md); padding: 0 4px 0 8px; border-radius: var(--iv-radius-sm); font-size: var(--iv-text-md); cursor: default; white-space: nowrap; }
.menu-item:hover { background: var(--iv-bg-active); }
.menu-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu-item .check { width: 14px; color: var(--iv-accent); }

.tabgroup { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: calc(var(--iv-radius-tab) + 2px); background: var(--iv-bg-subtle); box-shadow: inset 0 0 0 1px var(--iv-border); min-width: 0; }
.tabgroup .tab { width: auto; min-width: 0; max-width: 220px; height: 26px; }
.tabgroup .ctab { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: var(--iv-radius-md); color: var(--iv-text-muted); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); white-space: nowrap; cursor: pointer; }
.tabgroup .ctab:hover { background: var(--iv-bg-hover); }
.tabgroup .ctab[aria-selected="true"] { background: var(--iv-bg-raised); box-shadow: 0 0 0 1px var(--iv-border); color: var(--iv-text); }

.banner { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid color-mix(in srgb, var(--iv-danger) 40%, transparent); background: var(--iv-danger-subtle); color: var(--iv-text); font-size: var(--iv-text-sm); flex: none; }
.banner svg { color: var(--iv-danger); }
.banner span { flex: 1; min-width: 0; }

.btn { display: inline-flex; align-items: center; height: var(--iv-control-sm); padding: 0 8px; border: 1px solid var(--iv-border-strong); border-radius: var(--iv-radius-md); background: var(--iv-bg-raised); color: var(--iv-text); font-size: var(--iv-text-sm); font-weight: var(--iv-weight-medium); cursor: pointer; white-space: nowrap; transition: transform var(--iv-duration-press) var(--iv-ease-out); }

    ? `<button class="icon-btn" data-action="mode" title="Full width ⇧⌘↩">${I.expand}</button>`
    : `<button class="mode-btn" data-action="mode" title="Beside the chat ⇧⌘↩">${I.split}Beside chat</button>`
}

// ---------- Variants ----------
// 1 · Underlined: the panel's Tabs component in the sidebar; open files in a floating card with one tab row, beside the chat or across the main area.
function v1(tabStyle) {
  const tabs = `<div class="utabs" role="tablist" aria-label="Sidebar">${SIDE_TABS.map(([id, label]) => `<button class="utab" role="tab" aria-selected="${S.side === id}" data-action="side" data-side="${id}" title="${label} ${keyHint[id]}">${label}${id === "changes" ? ` <span class="count">${UNCOMMITTED.length}</span>` : ""}</button>`).join("")}</div>`
  const card = `<aside class="card">${cardTop()}<div class="card-body">${rail()}<div class="column">${listHead()}${tabs}<div class="panel">${sidePanel()}</div></div></div>${working()}</aside>`
  const titlebar = `<div class="titlebar"><div class="tab" data-selected>${I.claude()}<span>${SESSION.title}</span></div><div class="tab">${I.claude()}<span>Fix the branch picker on detached HEAD</span></div><button class="icon-btn md">${I.plus}</button></div>`
  let content
  if (!S.open.length) content = chat(false)
  else {
    const full = S.mode === "full"
    const onSession = full && S.selected === "session"
    const shown = current() || S.open[0]
    // Beside the chat the session is already on screen, so only full width lists it.
    const sessionTab = full ? `<button class="ptab" role="tab" aria-selected="${onSession}" data-action="select" data-key="session">${I.claude(14)}<span>Session</span></button><span class="subtab-sep" style="align-self:center"></span>` : ""
    const ptabs = sessionTab + S.open.map((o) => `<button class="ptab ${dirtyMark(o) ? "has-dirty" : ""}" role="tab" aria-selected="${!onSession && keyOf(o) === keyOf(shown)}" data-action="select" data-key="${keyOf(o)}">${subLabel(o)}${dirtyMark(o)}${closeBtn(o)}</button>`).join("")
    const fcard = `<section class="fcard" ${onSession ? "data-on-session" : ""} aria-label="Open files"><div class="pane-head" data-tabstyle="${tabStyle}"><div class="ptabs" role="tablist">${ptabs}</div>${modeButton()}</div>${onSession ? chat(false) : viewBody(shown)}</section>`
    content = S.mode === "beside"
      ? `<div class="content side">${chat(true)}${fcard}</div>`
      : `<div class="content full-card">${fcard}</div>`
  }
  return `<div class="app">${card}<main class="main">${titlebar}${content}</main></div>`
}

const TAB_STYLES = ["pill", "underline", "raised", "folder"]
const variants = TAB_STYLES.map((style) => () => v1(style))

// ---------- Overlays ----------
function fuzzy(text, q) {
  const t = text.toLowerCase(), qq = q.toLowerCase().replace(/\s+/g, "")
  const idx = []
  let j = 0
  for (let i = 0; i < t.length && j < qq.length; i++) if (t[i] === qq[j]) { idx.push(i); j++ }
  return j === qq.length ? idx : null
}
function markMatch(text, idx) {
  const set = new Set(idx)
  return [...text].map((ch, i) => set.has(i) ? `<span class="hl">${esc(ch)}</span>` : esc(ch)).join("")
}
function gotoResults() {
  const q = S.goto.q.trim()
  if (!q) return ALL_FILES.slice(0, 12).map((p) => ({ p, m: [] }))
  return ALL_FILES.map((p) => {
    const nm = fuzzy(base(p), q)
    if (nm) return { p, m: nm, score: nm[nm.length - 1] - nm[0] }
    const pm = fuzzy(p, q)
    return pm ? { p, m: null, score: 100 + pm[pm.length - 1] - pm[0] } : null
  }).filter(Boolean).sort((a, b) => a.score - b.score).slice(0, 30)
}
function overlays() {
  let html = ""
  if (S.goto) {
    const res = gotoResults()
    html += `<div class="goto-layer" data-action="goto-close"><div class="goto" data-stop role="dialog" aria-label="Go to file">
      <div class="goto-field">${I.search(16)}<input data-input="goto" placeholder="Go to a file in feat-files-tab" value="${esc(S.goto.q)}" /></div>
      <div class="goto-list" role="listbox">${res.length ? res.map((r, i) => `<div class="goto-item" role="option" data-action="goto-pick" data-path="${r.p}" ${i === S.goto.idx ? "data-highlighted" : ""}>${I.file()}<span class="gname">${r.m && r.m.length ? markMatch(base(r.p), r.m) : esc(base(r.p))}</span><span class="gpath mono">${esc(dirOf(r.p))}</span>${STATUS[r.p] ? `<span class="mono" style="font-size:var(--iv-text-xs);color:var(--iv-git-${({ M: "modified", A: "added", U: "untracked" })[STATUS[r.p]]})">${STATUS[r.p]}</span>` : ""}</div>`).join("") : `<div class="empty">No file in the working folder matches “${esc(S.goto.q)}”.</div>`}</div>
      <div class="goto-foot"><span>↑↓ to move · ↩ to open · esc to close</span><span class="tabular">${ALL_FILES.length} files</span></div>
    </div></div>`
  }
  if (S.dialog) {
    const d = S.dialog
    const untracked = d.st === "U"
    html += `<div class="scrim" data-action="dialog-cancel"><div class="dialog" data-stop role="alertdialog" aria-labelledby="dlg-t">
      <h2 id="dlg-t">${untracked ? `Delete “${esc(base(d.path))}”?` : `Discard the changes to “${esc(base(d.path))}”?`}</h2>
      <p>${untracked ? "Git does not track this file, so discarding its changes deletes it. This cannot be undone." : "The file goes back to its last commit. This cannot be undone."}</p>
      <p class="mono faint" style="margin-top:8px;font-size:var(--iv-text-xs)">${esc(d.path)}</p>
      <div class="actions"><button class="btn md" data-action="dialog-cancel" autofocus>Cancel</button><button class="btn md danger" data-action="discard">${untracked ? "Delete file" : "Discard changes"}</button></div>
    </div></div>`
  }
  return html
}

// ---------- Render + events ----------
const stage = document.getElementById("stage")
function render(keepFocus) {
  const focused = document.activeElement?.dataset?.input
  const caret = document.activeElement?.selectionStart
  stage.innerHTML = variants[variant]() + overlays()
  if (focused || keepFocus) {
    const el = stage.querySelector(`[data-input="${focused || keepFocus}"]`)
    if (el) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret) }
  }
  stage.querySelector(".goto-item[data-highlighted]")?.scrollIntoView({ block: "nearest" })
}
function openView(view) {
  const k = keyOf(view)
  if (!S.open.some((o) => keyOf(o) === k)) S.open.push(view)
  else S.open = S.open.map((o) => keyOf(o) === k ? view : o)
  S.selected = k
  S.menu = false
}
function reveal(path) {
  const parts = path.split("/")
  for (let i = 1; i < parts.length; i++) S.expanded.add(parts.slice(0, i).join("/"))
}

stage.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]")
  if (!el) return
  const a = el.dataset.action, p = el.dataset.path
  // A backdrop closes only when the click lands on the backdrop itself.
  if ((a === "goto-close" || a === "dialog-cancel") && !el.matches("button") && e.target !== el) return
  e.stopPropagation()
  switch (a) {
    case "side": S.side = el.dataset.side; break
    case "toggle": S.expanded.has(p) ? S.expanded.delete(p) : S.expanded.add(p); break
    case "open-file": openView({ kind: "file", path: p }); reveal(p); break
    case "open-diff": openView({ kind: "diff", path: p, base: el.dataset.group }); break
    case "select": S.selected = el.dataset.key; S.menu = false; break
    case "close": {
      const k = el.dataset.key
      const v = S.open.find((o) => keyOf(o) === k)
      if (v.kind === "file" && S.dirty[v.path] && !confirm(`${base(v.path)} has unsaved changes. Close it and lose them?`)) return
      const i = S.open.indexOf(v)
      S.open.splice(i, 1)
      delete S.dirty[v.path]; delete S.edited[v.path]
      if (S.selected === k) S.selected = S.open[Math.min(i, S.open.length - 1)] ? keyOf(S.open[Math.min(i, S.open.length - 1)]) : "session"
      if (!S.open.length) S.selected = "session"
      break
    }
    case "mode": S.mode = S.mode === "beside" ? "full" : "beside"; if (S.mode === "beside" && S.selected === "session" && S.open[0]) S.selected = keyOf(S.open[0]); break
    case "ignored": S.showIgnored = !S.showIgnored; break
    case "collapse": S.expanded.clear(); break
    case "group": S.groups[el.dataset.group] = !S.groups[el.dataset.group]; break
    case "menu": S.menu = !S.menu; break
    case "ask-discard": S.dialog = { path: p, st: el.dataset.st }; break
    case "dialog-cancel": S.dialog = null; break
    case "discard": {
      const path = S.dialog.path
      S.dialog = null
      if (path.endsWith("git.ts")) { S.discardError = path; break }
      const i = UNCOMMITTED.findIndex((c) => c.path === path)
      if (i >= 0) UNCOMMITTED.splice(i, 1)
      S.open = S.open.filter((o) => !(o.kind === "diff" && o.path === path && o.base === "uncommitted"))
      if (!S.open.some((o) => keyOf(o) === S.selected)) S.selected = S.open[0] ? keyOf(S.open[0]) : "session"
      break
    }
    case "goto-close": S.goto = null; break
    case "goto-pick": S.goto = null; openView({ kind: "file", path: p }); reveal(p); break
    case "reload": delete S.edited[S.conflict]; delete S.dirty[S.conflict]; S.conflict = null; break
    case "overwrite": S.dirty[S.conflict] = false; S.justSaved = S.conflict; S.conflict = null; setTimeout(() => { S.justSaved = null; render() }, 1500); break
  }
  render()
})
stage.addEventListener("input", (e) => {
  const inp = e.target.dataset?.input
  if (inp === "filter") { S.filter = e.target.value; render("filter") }
  else if (inp === "goto") { S.goto.q = e.target.value; S.goto.idx = 0; render("goto") }
  const ed = e.target.closest?.("[data-editor]")
  if (ed) {
    const path = ed.dataset.editor
    S.edited[path] = ed.innerText
    if (!S.dirty[path]) {
      S.dirty[path] = true
      // Mark the sub-tab without re-rendering, so the caret stays put.
      stage.querySelectorAll(`[data-key="file:${CSS.escape(path)}"]`).forEach((t) => {
        if (t.classList.contains("close-x")) return
        t.classList.add("has-dirty")
        t.querySelector(".close-x")?.insertAdjacentHTML("beforebegin", `<span class="dirty" title="Unsaved"></span>`)
      })
    }
  }
})
document.addEventListener("keydown", (e) => {
  if (e.metaKey && (e.key === "p" || e.key === "P")) { e.preventDefault(); S.goto = { q: "", idx: 0 }; render("goto"); return }
  if (e.metaKey && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); S.side = SIDE_TABS[+e.key - 1][0]; render(); return }
  if (e.metaKey && e.shiftKey && e.key === "Enter") { e.preventDefault(); if (S.open.length) { S.mode = S.mode === "beside" ? "full" : "beside"; render() } return }
  if (e.metaKey && e.key === "s") {
    e.preventDefault()
    const v = current()
    if (v?.kind === "file") {
      if (S.conflict === v.path) return
      S.dirty[v.path] = false; S.justSaved = v.path; render()
      setTimeout(() => { S.justSaved = null; render() }, 1500)
    }
    return
  }
  if (S.goto) {
    const res = gotoResults()
    if (e.key === "Escape") { S.goto = null; render(); e.stopPropagation() }
    else if (e.key === "ArrowDown") { e.preventDefault(); S.goto.idx = Math.min(res.length - 1, S.goto.idx + 1); render("goto") }
    else if (e.key === "ArrowUp") { e.preventDefault(); S.goto.idx = Math.max(0, S.goto.idx - 1); render("goto") }
    else if (e.key === "Enter" && res[S.goto.idx]) { const p = res[S.goto.idx].p; S.goto = null; openView({ kind: "file", path: p }); reveal(p); render() }
    return
  }
  if (S.dialog && e.key === "Escape") { S.dialog = null; render(); return }
  if (S.menu && e.key === "Escape") { S.menu = false; render() }
}, true)

// ---------- Scenario switch ----------
const scenarioBtns = [...document.querySelectorAll("[data-scenario]")]
function setScenario(name) {
  scenario = name
  UNCOMMITTED.length = 0
  UNCOMMITTED.push(
    { path: "apps/server/src/rpc/handlers.ts", st: "M", add: 11, del: 1 },
    { path: "apps/server/src/modules/worktree/usecases/git.ts", st: "M", add: 6, del: 0 },
    { path: "apps/server/src/rpc/files.test.ts", st: "U", add: 48, del: 0 },
    { path: "DESIGN.md", st: "M", add: 4, del: 1 },
    { path: "docs/old-notes.md", st: "D", add: 0, del: 23 },
  )
  S = fresh()
  SCENARIOS[name]()
  scenarioBtns.forEach((b) => b.toggleAttribute("data-active", b.dataset.scenario === name))
  const url = new URL(location); url.searchParams.set("s", name); history.replaceState(null, "", url)
  render(S.goto ? "goto" : null)
}
scenarioBtns.forEach((b) => b.addEventListener("click", () => setScenario(b.dataset.scenario)))

// ---------- Picker wiring (PICKER.md, adapted to the state render) ----------
const picker = document.querySelector(".proto-picker")
const highlightEl = picker.querySelector(".proto-picker-highlight")
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")]
function moveHighlight() {
  const el = items[variant]
  highlightEl.style.width = el.offsetWidth + "px"
  highlightEl.style.transform = `translateX(${el.offsetLeft}px)`
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return
  variant = i
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i)
    if (j === i) el.setAttribute("aria-current", "true")
    else el.removeAttribute("aria-current")
  })
  moveHighlight()
  const url = new URL(location)
  url.searchParams.set("v", i + 1)
  history.replaceState(null, "", url)
  stage.innerHTML = ""
  requestAnimationFrame(() => render(S.goto ? "goto" : null))
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)))
window.addEventListener("resize", moveHighlight)
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (S.goto || S.dialog) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= variants.length) setActive(num - 1)
  else if (e.key === "ArrowRight") setActive((variant + 1) % variants.length)
  else if (e.key === "ArrowLeft") setActive((variant - 1 + variants.length) % variants.length)
})
const params = new URLSearchParams(location.search)
const reqS = params.get("s")
setScenario(SCENARIOS[reqS] ? reqS : "tree")
const requested = parseInt(params.get("v"), 10)
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")))
</script>
</body>
</html>
