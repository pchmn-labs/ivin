const CHECK = '<svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg>'
const QMARK = '<svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M140,180a12,12,0,1,1-12-12A12,12,0,0,1,140,180ZM128,72c-22.06,0-40,16.15-40,36v4a8,8,0,0,0,16,0v-4c0-11,10.77-20,24-20s24,9,24,20-10.77,20-24,20a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-.72c18.24-3.35,32-17.9,32-35.28C168,88.15,150.06,72,128,72Zm104,56A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>'
const X = '<svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>'
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])

let variant = 0
let S
function fresh() {
  S = {
    status: "open",
    answers: QUESTIONS.map(() => ({ picked: new Set(), other: "" })),
    step: 0, row: 0, // stepper: question and row; form and compact reuse step/row as the cursor
    editing: false,
    stepAnim: false,
    entered: false,
  }
}
const isAnswered = (i) => { const a = S.answers[i]; return [...a.picked].some((p) => p !== OTHER(QUESTIONS[i]) || a.other.trim() !== "") }
const allAnswered = () => QUESTIONS.every((_, i) => isAnswered(i))
const choicesOf = (i) => { const q = QUESTIONS[i], a = S.answers[i]; return [...a.picked].sort((x, y) => x - y).map((p) => p === OTHER(q) ? a.other.trim() : q.options[p][0]).filter(Boolean) }

function pick(i, row) {
  const q = QUESTIONS[i], a = S.answers[i]
  if (q.multi) { a.picked.has(row) ? a.picked.delete(row) : a.picked.add(row) }
  else a.picked = new Set([row])
}

/* Transcript */
const before = `
  <div class="item bubble-row"><div class="bubble">Add tests for the order totals.</div></div>
  <div class="item">I read <code>src/orders/totals.ts</code>. A couple of questions before I write the tests.</div>
  <div class="item tool">${QMARK}<span class="name">Asked 3 questions</span></div>`
function record() {
  if (S.status === "declined") return `<div class="item rec-line rise">${X}<span class="text">Declined the agent's questions</span></div>`
  const pairs = QUESTIONS.map((q, i) => [q, choicesOf(i).join(", ")])
  if (variant === 0) return `<div class="item rec-steps rise">${pairs.map(([q, a]) => `<div class="pair"><span class="q">${esc(q.header)}</span><span class="a">${esc(a)}</span></div>`).join("")}</div>`
  if (variant === 1) return `<div class="item rise"><div class="rec-card">${pairs.map(([q, a]) => `<div class="qa"><div class="q">${esc(q.question)}</div><div class="a">${esc(a)}</div></div>`).join("")}</div></div>`
  return `<div class="item rec-line rise">${CHECK}<span class="text">${pairs.map(([q, a]) => `${esc(q.header)}: <b>${esc(a)}</b>`).join(" · ")}</span></div>`
}
function renderTranscript() {
  const after = S.status === "open" ? "" : record() + `<div class="item rise">${S.status === "declined" ? "Understood, I'll go with Vitest and cover <code>src/orders</code>." : `Thanks — I'll write them with ${esc(choicesOf(0).join(", "))}.`}</div>`
  document.getElementById("transcript").innerHTML = before + after
  const mark = document.getElementById("mark")
  mark.dataset.status = S.status === "open" ? "waiting" : "working"
  mark.querySelector(".overlay").textContent = S.status === "open" ? "?" : ""
  const sc = document.getElementById("scroller"); sc.scrollTop = sc.scrollHeight
}

/* 1. Stepper: one question at a time */
function stepper() {
  const q = QUESTIONS[S.step], a = S.answers[S.step]
  const tabs = QUESTIONS.map((x, i) => {
    const done = isAnswered(i) && i !== S.step
    return `${i ? '<span class="st-line" aria-hidden="true"></span>' : ""}<button class="st" data-tab="${i}" ${i === S.step ? 'data-current aria-current="step"' : ""} ${done ? "data-done" : ""}><span class="st-dot">${done ? CHECK : i + 1}</span>${esc(x.header)}</button>`
  }).join("")
  const rows = [...q.options.map(([l, d], r) => ({ l, d, r })), { l: "Other", d: "", r: OTHER(q) }]
  const opts = rows.map(({ l, d, r }) => {
    const picked = a.picked.has(r)
    const body = r === OTHER(q) && (S.editing || a.other)
      ? `<span class="opt-label">Other</span>${S.editing && S.row === r ? `<input class="other-input" id="other" placeholder="Your answer" value="${esc(a.other)}">` : `<span class="opt-desc">${esc(a.other)}</span>`}`
      : `<span class="opt-label">${esc(l)}</span><span class="opt-desc">${esc(d || (r === OTHER(q) ? "Type your own answer" : ""))}</span>`
    const lead = q.multi ? `<span class="check">${picked ? CHECK : ""}</span>` : `<span class="radio"></span>`
    const tail = `<span class="iv-option-list__hint kbd">${r + 1}</span>`
    return `<div class="iv-option-list__option" role="${q.multi ? "checkbox" : "radio"}" aria-checked="${picked}" data-row="${r}" ${S.row === r ? "data-cursor" : ""} ${picked ? "data-picked" : ""}>${lead}${body}${tail}</div>`
  }).join("")
  const last = S.step === QUESTIONS.length - 1
  const ticked = choicesOf(S.step).length
  const decline = `<button class="iv-button" data-act="decline">Decline <span class="faint" style="font-size:var(--iv-text-xs)">Esc</span></button>`
  const foot = `<div class="sheet-foot"><span class="keys"><span><kbd>↑↓</kbd>Navigate</span>·<span><kbd>Space</kbd>Select</span></span><span class="grow"></span>${decline}${q.multi ? `<span class="faint kbd" style="font-size:var(--iv-text-xs);margin-left:var(--iv-space-2)">${ticked ? `${ticked} chosen` : ""}</span><button class="iv-button" data-variant="primary" data-act="continue" ${ticked ? "" : "disabled"}>${last ? "Send" : "Continue"}</button>` : ""}</div>`
  return `<div class="iv-action-sheet" data-testid="question-sheet">
    <div class="iv-action-sheet__head">${QMARK.replace('width="14" height="14"', 'width="16" height="16"')}<span class="iv-action-sheet__title">The agent asks</span><span class="stepper">${tabs}</span></div>
    <div class="${S.stepAnim ? "step-in" : ""}">
      <div class="step-question">${esc(q.question)}</div>
      ${q.multi ? '<div class="step-sub">Choose one or more</div>' : ""}
      <div class="iv-option-list" role="${q.multi ? "group" : "radiogroup"}">${opts}</div>
    </div>
    ${foot}</div>`
}
function stepperKey(e) {
  const q = QUESTIONS[S.step], n = q.options.length + 1
  const goTo = (i) => { if (i < 0 || i >= QUESTIONS.length) return; S.step = i; S.row = Math.max(0, Math.min(...S.answers[i].picked, 99) === 99 ? 0 : Math.min(...S.answers[i].picked)); S.stepAnim = true; S.editing = false }
  const advance = () => { if (S.step === QUESTIONS.length - 1) { allAnswered() ? submit() : goTo(QUESTIONS.findIndex((_, i) => !isAnswered(i))) } else goTo(S.step + 1) }
  const choose = (r) => {
    S.row = r
    if (r === OTHER(q) && !S.editing && !S.answers[S.step].other.trim()) { S.editing = true; if (!q.multi) S.answers[S.step].picked = new Set([r]); else S.answers[S.step].picked.add(r); return }
    if (q.multi) pick(S.step, r); else { pick(S.step, r); advance() }
  }
  if (e.key === "ArrowDown") S.row = (S.row + 1) % n
  else if (e.key === "ArrowUp") S.row = (S.row - 1 + n) % n
  else if (e.key === "ArrowRight") goTo(S.step + 1)
  else if (e.key === "ArrowLeft") goTo(S.step - 1)
  else if (/^[1-9]$/.test(e.key) && +e.key <= n) choose(+e.key - 1)
  else if (e.key === " ") { if (S.row === OTHER(q) && !S.answers[S.step].other.trim()) choose(S.row); else pick(S.step, S.row) }
  else if (e.key === "Enter") { if (q.multi) { if (!isAnswered(S.step)) choose(S.row); if (isAnswered(S.step)) advance() } else choose(S.row) }
  else return false
  return true
}

/* 2. Form: every question at once */
function form() {
  const blocks = QUESTIONS.map((q, i) => {
    const a = S.answers[i]
    const rows = [...q.options.map(([l, d], r) => ({ l, d, r })), { l: "Other", d: "", r: OTHER(q) }]
    const opts = rows.map(({ l, d, r }) => {
      const picked = a.picked.has(r), cursor = S.step === i && S.row === r
      const desc = r === OTHER(q)
        ? (S.editing && cursor ? `<input class="other-input" id="other" placeholder="Your answer" value="${esc(a.other)}" style="margin-top:4px">` : `<span class="opt-desc">${esc(a.other || "Type your own answer")}</span>`)
        : `<span class="opt-desc">${esc(d)}</span>`
      return `<div class="iv-option-list__option" role="${q.multi ? "checkbox" : "radio"}" aria-checked="${picked}" data-q="${i}" data-row="${r}" ${cursor ? "data-cursor" : ""} ${picked ? "data-picked" : ""}><span class="box" data-shape="${q.multi ? "check" : "radio"}">${q.multi && picked ? CHECK : ""}</span><span class="form-opt"><span class="opt-label">${esc(l)}</span>${desc}</span></div>`
    }).join("")
    return `<div><div class="form-q-caption">${esc(q.header)}</div><div class="form-q-text">${esc(q.question)}${q.multi ? ' <span class="faint">· Several answers</span>' : ""}</div><div class="iv-option-list">${opts}</div></div>`
  }).join("")
  const left = QUESTIONS.length - QUESTIONS.filter((_, i) => isAnswered(i)).length
  return `<div class="iv-action-sheet" data-testid="question-sheet">
    <div class="iv-action-sheet__head"><span class="iv-action-sheet__title">The agent has ${QUESTIONS.length} questions</span></div>
    <div class="form" id="form">${blocks}</div>
    <div class="sheet-foot"><p class="iv-action-sheet__hint">${left ? `${left} left to answer · ` : ""}↑↓ to move, Space to choose, ⌘Enter to send, Esc to decline</p>
      <button class="iv-button" data-act="decline">Decline</button>
      <button class="iv-button" data-variant="primary" data-act="send" ${allAnswered() ? "" : "disabled"}>Send answers</button></div></div>`
}
function formKey(e) {
  const flat = QUESTIONS.flatMap((q, i) => [...Array(q.options.length + 1).keys()].map((r) => [i, r]))
  const at = flat.findIndex(([i, r]) => i === S.step && r === S.row)
  const move = (d) => { const [i, r] = flat[(at + d + flat.length) % flat.length]; S.step = i; S.row = r }
  const q = QUESTIONS[S.step]
  const choose = () => {
    if (S.row === OTHER(q) && !S.answers[S.step].other.trim()) { S.editing = true; if (q.multi) S.answers[S.step].picked.add(S.row); else S.answers[S.step].picked = new Set([S.row]); return }
    pick(S.step, S.row)
    if (!q.multi && S.step < QUESTIONS.length - 1) { S.step += 1; S.row = 0 }
  }
  if (e.key === "Enter" && e.metaKey) { if (allAnswered()) submit() }
  else if (e.key === "ArrowDown") move(1)
  else if (e.key === "ArrowUp") move(-1)
  else if (e.key === " " || e.key === "Enter") choose()
  else return false
  return true
}

/* 3. Compact: one block per question, options as chips */
function compact() {
  const blocks = QUESTIONS.map((q, i) => {
    const a = S.answers[i]
    const chips = [...q.options.map(([l], r) => ({ l, r })), { l: "Other…", r: OTHER(q) }].map(({ l, r }) => {
      const cursor = S.step === i && S.row === r, picked = a.picked.has(r)
      const inner = r === OTHER(q) && cursor && S.editing ? `<input class="other-input" id="other" placeholder="Your answer" value="${esc(a.other)}">` : esc(r === OTHER(q) && a.other ? a.other : l)
      return `<button class="chip" tabindex="-1" data-q="${i}" data-row="${r}" ${cursor ? "data-cursor" : ""} ${picked ? "data-picked" : ""} aria-pressed="${picked}">${picked && q.multi ? CHECK : ""}${inner}</button>`
    }).join("")
    return `<div class="cq" ${S.step === i ? "data-current" : ""}><span class="cq-head">${esc(q.header)}</span><span class="cq-text">${esc(q.question)}</span><div class="chips">${chips}</div></div>`
  }).join("")
  const q = QUESTIONS[S.step]
  const desc = S.row === OTHER(q) ? "Your own answer, in place of the options." : q.options[S.row][1]
  return `<div class="iv-action-sheet" data-testid="question-sheet">
    <div class="iv-action-sheet__head"><span class="iv-action-sheet__title">The agent asks</span></div>
    <div class="compact">${blocks}</div>
    <div class="sheet-foot"><p class="iv-action-sheet__hint chip-desc"><span class="muted">${esc(desc)}</span>${q.multi ? " · several answers" : ""}<br>←→ ↑↓ to move, Space to choose, Enter to send, Esc to decline</p>
      <button class="iv-button" data-variant="primary" data-act="send" ${allAnswered() ? "" : "disabled"}>Send</button></div></div>`
}
function compactKey(e) {
  const q = QUESTIONS[S.step], n = q.options.length + 1
  const choose = () => {
    if (S.row === OTHER(q) && !S.answers[S.step].other.trim()) { S.editing = true; if (q.multi) S.answers[S.step].picked.add(S.row); else S.answers[S.step].picked = new Set([S.row]); return }
    pick(S.step, S.row)
  }
  if (e.key === "ArrowRight") S.row = (S.row + 1) % n
  else if (e.key === "ArrowLeft") S.row = (S.row - 1 + n) % n
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") { S.step = (S.step + (e.key === "ArrowDown" ? 1 : -1) + QUESTIONS.length) % QUESTIONS.length; S.row = Math.min(S.row, QUESTIONS[S.step].options.length) }
  else if (e.key === " ") choose()
  else if (e.key === "Enter") {
    if (S.row === OTHER(q) && !isAnswered(S.step)) choose()
    else if (allAnswered()) submit()
    else { if (!isAnswered(S.step)) pick(S.step, S.row); const next = QUESTIONS.findIndex((_, i) => !isAnswered(i)); if (next !== -1) { S.step = next; S.row = 0 } }
  }
  else return false
  return true
}

const VARIANTS = [[stepper, stepperKey], [form, formKey], [compact, compactKey]]

function render() {
  const above = document.getElementById("above")
  above.innerHTML = S.status === "open" ? VARIANTS[variant][0]() : ""
  if (S.entered) above.querySelector(".iv-action-sheet")?.setAttribute("data-entered", "")
  S.entered = S.status === "open"
  S.stepAnim = false
  const input = document.getElementById("other")
  if (input) {
    input.focus(); input.setSelectionRange(input.value.length, input.value.length)
    input.addEventListener("input", () => { S.answers[S.step].other = input.value; const send = above.querySelector('[data-act="send"]'); if (send) send.disabled = !allAnswered() })
  }
  above.querySelector("[data-cursor]")?.scrollIntoView({ block: "nearest" })
}
function submit() { S.status = "answered"; S.editing = false; render(); renderTranscript() }
function decline() { S.status = "declined"; S.editing = false; render(); renderTranscript() }

/* The sheet takes the keys while the composer is empty, as the approval sheet does. */
document.addEventListener("keydown", (e) => {
  if (S.status !== "open") return
  const field = document.getElementById("field")
  if (e.target === document.getElementById("other")) {
    if (e.key === "Escape") { e.preventDefault(); S.editing = false; render() }
    else if (e.key === "Enter") {
      e.preventDefault(); S.editing = false
      const q = QUESTIONS[S.step]
      if (!S.answers[S.step].other.trim()) S.answers[S.step].picked.delete(OTHER(q))
      if (variant === 0 && !q.multi && isAnswered(S.step) && S.step < QUESTIONS.length - 1) { S.step += 1; S.row = 0; S.stepAnim = true }
      if (variant === 1 && !q.multi && S.step < QUESTIONS.length - 1) { S.step += 1; S.row = 0 }
      render()
    }
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); S.editing = false; VARIANTS[variant][1](e); render() }
    return
  }
  if (e.target === field && field.value !== "") return
  if (e.target !== field && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return
  if ((e.ctrlKey || e.altKey) || (e.metaKey && e.key !== "Enter")) return
  if (e.key === "Escape") { e.preventDefault(); decline(); return }
  if (/^[1-9]$/.test(e.key) && variant !== 0) return
  if (VARIANTS[variant][1](e)) { e.preventDefault(); e.stopImmediatePropagation(); render() }
}, true)

document.getElementById("above").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act
  if (act === "send") return submit()
  if (act === "continue") { stepperKey({ key: "Enter" }); return render() }
  if (act === "decline") return decline()
  const tab = e.target.closest("[data-tab]")
  if (tab) { S.step = +tab.dataset.tab; S.row = 0; S.stepAnim = true; S.editing = false; return render() }
  const opt = e.target.closest("[data-row]")
  if (!opt || e.target.id === "other") return
  if (opt.dataset.q !== undefined) S.step = +opt.dataset.q
  S.row = +opt.dataset.row
  const q = QUESTIONS[S.step]
  if (S.row === OTHER(q)) { S.editing = true; if (q.multi) S.answers[S.step].picked.add(S.row); else S.answers[S.step].picked = new Set([S.row]); return render() }
  if (variant === 0) { stepperKey({ key: String(S.row + 1) }) }
  else if (variant === 1) formKey({ key: " " })
  else compactKey({ key: " " })
  render()
})

/* Picker wiring, per PICKER.md */
const picker = document.querySelector(".proto-picker")
const highlight = picker.querySelector(".proto-picker-highlight")
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")]
const replay = picker.querySelector(".proto-picker-replay")
function moveHighlight() { const el = items[variant]; highlight.style.width = el.offsetWidth + "px"; highlight.style.transform = `translateX(${el.offsetLeft}px)` }
function mount() { fresh(); document.getElementById("above").innerHTML = ""; renderTranscript(); requestAnimationFrame(render) }
function setActive(i) {
  if (i < 0 || i >= VARIANTS.length) return
  variant = i
  items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current") })
  moveHighlight()
  const url = new URL(location); url.searchParams.set("v", i + 1); history.replaceState(null, "", url)
  mount()
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)))
replay.addEventListener("click", mount)
document.getElementById("reset").addEventListener("click", mount)
document.getElementById("theme").addEventListener("click", () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "forest-dark" ? "forest-light" : "forest-dark" })
window.addEventListener("resize", moveHighlight)
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  // Digits belong to the stepper's options while its sheet is open; the picker keeps ← → only when no sheet is open.
  if (S.status === "open") { if (e.key === "r" || e.key === "R") mount(); else if (e.key === "a" || e.key === "A") mount(); else if (e.key === "t" || e.key === "T") document.getElementById("theme").click(); return }
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= VARIANTS.length) setActive(num - 1)
  else if (e.key === "ArrowRight") setActive((variant + 1) % VARIANTS.length)
  else if (e.key === "ArrowLeft") setActive((variant - 1 + VARIANTS.length) % VARIANTS.length)
  else if (e.key === "r" || e.key === "R" || e.key === "a" || e.key === "A") mount()
  else if (e.key === "t" || e.key === "T") document.getElementById("theme").click()
})
const requested = parseInt(new URLSearchParams(location.search).get("v"), 10)
setActive(requested >= 1 && requested <= VARIANTS.length ? requested - 1 : 0)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")))
</script>
</body>
</html>
