    state.opts = { model: "sonnet", effort: "high", permissionMode: "bypassPermissions" }
    state.previous = { model: "sonnet", effort: "high", permissionMode: "manual" }
    state.changes = [{ option: "permissionMode", from: "manual", to: "bypassPermissions", before: true }]
    state.text = FAILED_MESSAGE
  } else {
    state.opts = { model: "sonnet", effort: "high", permissionMode: "manual" }
    state.previous = null
    state.text = ""
  }
}

function setOption(option, value) {
  const from = state.opts[option]
  if (from === value) return
  state.opts = { ...state.opts, [option]: value }
  state.changes = [...state.changes, { option, from, to: value }]
  if (state.previous && OPTIONS.every((o) => state.opts[o] === state.previous[o])) state.previous = null
}

function goBack() {
  for (const o of OPTIONS) setOption(o, state.previous[o])
  state.previous = null
  state.focus = "field"
  render()
}

/* ---------- Transcript, shared, with each variant's change line ---------- */
const changeLine = {
  0: (c) => `<p style="color:var(--iv-text-muted);font-size:var(--iv-text-sm)">${LABEL[c.option]} changed from <span class="mono" style="color:var(--iv-text)">${esc(c.from)}</span> to <span class="mono" style="color:var(--iv-text)">${esc(c.to)}</span></p>`,
  1: (c) => `<span class="change-chip">${LABEL[c.option].toLowerCase()} <span class="mono">${esc(c.from)}</span>${svg.arrow}<span class="mono">${esc(c.to)}</span></span>`,
  2: (c) => `<div class="divider"><span><span class="mono">${LABEL[c.option].toLowerCase()} ${esc(c.to)}</span> from here on</span></div>`,
}

function transcript() {
  const line = changeLine[state.variant]
  const before = state.changes.filter((c) => c.before).map((c) => `<div class="item">${line(c)}</div>`).join("")
  const after = state.changes.filter((c) => !c.before).map((c) => `<div class="item">${line(c)}</div>`).join("")
  const base = `
    <div class="item"><div class="bubble">Why does the login test fail on CI but not locally?</div></div>
    <div class="item"><p>The test waits for <code class="mono">networkidle</code>, and CI's slower machines hit the 5 s timeout before the session cookie is set. It passes locally because the page settles in about 2 s.</p></div>
    <div class="item"><div class="tool">${svg.worktree}<b>Read</b><code>e2e/login.spec.ts</code></div></div>`
  if (state.scenario === "working") {
    return base + `
      <div class="item"><div class="bubble">Raise the timeout and wait for the cookie instead</div></div>
      <div class="item"><div class="tool"><span class="spin"></span><b>Edit</b><code>e2e/login.spec.ts</code></div></div>` + after
  }
  if (state.scenario === "failed") {
    return base + before + `
      <div class="item"><div class="bubble">${esc(FAILED_MESSAGE)}</div></div>
      <div class="item"><div class="error-block"><b>Error:</b> ${esc(REFUSAL)}</div></div>` + after
  }
  return base + after
}

/* ---------- Menus: one shared composer menu, opened above its trigger ---------- */
function menuGroups(which) {
  const opts = which === "all" ? OPTIONS : [which]
  return opts.map((o) => ({ option: o, label: which === "all" ? LABEL[o] : null, values: OFFERED[o] }))
}
function flatItems(which) {
  return menuGroups(which).flatMap((g) => g.values.map((v) => ({ option: g.option, value: v })))
}
function menuHtml(which) {
  let index = 0
  const groups = menuGroups(which).map((g) => `
    <div class="menu-group" role="group" ${g.label ? `aria-label="${g.label}"` : ""}>
      ${g.label ? `<div class="menu-heading">${g.label}</div>` : ""}
      ${g.values.map((v) => {
        const i = index++
        const hint = g.option === "permissionMode" && state.variant !== 1 ? `<span class="menu-hint">${HINTS[v]}</span>` : ""
        return `<div class="menu-item" role="option" data-index="${i}" ${i === state.highlight ? "data-highlighted" : ""} aria-selected="${state.opts[g.option] === v}">
          <span class="menu-label ${g.option === "model" ? "" : ""}">${esc(v)}</span>${hint}
          <span class="menu-check">${state.opts[g.option] === v ? svg.check : ""}</span></div>`
      }).join("")}
    </div>`).join("")
  const note = state.scenario === "working" ? `<div class="menu-note">Applies once the agent finishes this turn.</div>` : ""
  const foot = which === "all" ? `<div class="menu-foot"><span>Applies to this session</span><span><span class="kbd">↑↓</span> move · <span class="kbd">↵</span> pick · <span class="kbd">esc</span> close</span></div>` : ""
  return `<div class="menu" role="listbox" aria-label="${which === "all" ? "Run options" : LABEL[which]}"><div class="menu-viewport">${groups}${note}</div>${foot}</div>`
}

/* ---------- 1 · Three triggers ---------- */
function v1Controls() {
  return OPTIONS.map((o) => {
    const changed = state.previous && state.previous[o] !== state.opts[o]
    return `<span class="anchor">
      <button class="trigger" data-key="trigger-${o}" data-menu="${o}" ${state.menu === o ? "data-open" : ""} ${changed ? "data-changed" : ""} aria-label="${LABEL[o]}: ${state.opts[o]}" aria-haspopup="listbox" aria-expanded="${state.menu === o}">
        ${o === "model" ? svg.claude() : ""}${esc(state.opts[o])}${svg.chev}
      </button>${state.menu === o ? menuHtml(o) : ""}</span>`
  }).join("")
}
function backLabel() {
  const changed = OPTIONS.filter((o) => state.previous[o] !== state.opts[o])
  return changed.length === 1 ? `Back to ${state.previous[changed[0]]}` : "Go back"
}
function failureWhat() {
  return OPTIONS.filter((o) => state.previous[o] !== state.opts[o]).map((o) => `${LABEL[o].toLowerCase()} ${state.opts[o]}`).join(", ")
}

/* ---------- 2 · One summary ---------- */
function v2Controls() {
  return `<span class="anchor"><button class="trigger summary" data-key="trigger-all" data-menu="all" ${state.menu === "all" ? "data-open" : ""} aria-label="Run options: ${OPTIONS.map((o) => state.opts[o]).join(", ")}" aria-haspopup="listbox" aria-expanded="${state.menu === "all"}">
    ${svg.claude()}${esc(state.opts.model)} <span class="sep">·</span> ${esc(state.opts.effort)} <span class="sep">·</span> <span ${state.previous ? 'style="color:var(--iv-danger)"' : ""}>${esc(state.opts.permissionMode)}</span>${svg.chev}
  </button>${state.menu === "all" ? menuHtml("all") : ""}</span>`
}

/* ---------- 3 · Status line ---------- */
const meter = (effort) => {
  const level = OFFERED.effort.indexOf(effort)
  return `<span class="meter" aria-hidden="true">${[4, 6, 8, 9, 10].map((h, i) => `<i style="height:${h}px" ${i <= level ? "data-on" : ""}></i>`).join("")}</span>`
}
function v3Options() {
  return OPTIONS.map((o) => {
    const changed = state.previous && state.previous[o] !== state.opts[o]
    const inner = o === "model" ? `${svg.claude(12)}${esc(state.opts[o])}` : o === "effort" ? `${meter(state.opts[o])}${esc(state.opts[o])}` : esc(state.opts[o])
    return `<span class="anchor"><button class="st-trigger" data-key="trigger-${o}" data-menu="${o}" ${state.menu === o ? "data-open" : ""} ${changed ? "data-changed" : ""} aria-label="${LABEL[o]}: ${state.opts[o]}" aria-haspopup="listbox" aria-expanded="${state.menu === o}">${inner}</button>${state.menu === o ? menuHtml(o) : ""}</span>`
  }).join('<span class="st-dot">·</span>')
}

function sendButton() {
  return state.scenario === "working" && state.text.trim() === ""
    ? `<button class="icon-btn secondary" aria-label="Interrupt">${svg.stop}</button>`
    : `<button class="icon-btn primary" aria-label="Send">${svg.send}</button>`
}
const where = `<span class="loc">${svg.worktree}Worktree</span><span class="loc mono">${svg.branch}fix/flaky-login</span>`
const usage = `<span>48,210 tokens · $0.412</span>`

function composer() {
  const v = state.variant
  const failed = !!state.previous
  const field = `<textarea class="field" data-key="field" rows="2" placeholder="Message Claude" aria-label="Message">${esc(state.text)}</textarea>`
  if (v === 0) {
    const alert = failed ? `<div class="alert" role="alert">${svg.alert}<span>The agent failed on the first message with ${failureWhat()}. Go back to what worked, or pick another value.</span><button class="ghost-btn" data-action="back" data-key="back">${backLabel()}</button></div>` : ""
    return `<div class="composer">${alert}<div class="surface">${field}<div class="row"><div class="left">${v1Controls()}</div>${sendButton()}</div></div>
      <div class="statusline"><div class="status-left">${where}</div>${usage}</div></div>`
  }
  if (v === 1) {
    const sheet = failed ? `<div class="sheet" role="alert">
      <div class="sheet-head">${svg.alert}The agent did not start with ${failureWhat()}</div>
      <p class="sheet-detail">${esc(REFUSAL)}</p>
      <div class="sheet-actions"><span class="sheet-hint">Your message is back in the field.</span>
        <span style="display:flex;gap:4px"><button class="ghost-btn" data-action="open-all" data-key="pick-other">Pick another</button><button class="primary-btn" data-action="back" data-key="back">${backLabel()}</button></span></div></div>` : ""
    return `<div class="composer ${failed ? "has-sheet" : ""}">${sheet}<div class="surface">${field}<div class="row"><div class="left">${v2Controls()}</div>${sendButton()}</div></div>
      <div class="statusline"><div class="status-left">${where}</div>${usage}</div></div>`
  }
  const error = failed
    ? `<div class="statusline under-error" role="alert">${svg.alert}<span>Failed with ${failureWhat()}. Your message is back in the field.</span><button class="ghost-btn" data-action="back" data-key="back">${backLabel()}</button></div>`
    : ""
  return `<div class="composer"><div class="surface">${field}<div class="row"><div class="left"></div>${sendButton()}</div></div>
    <div class="statusline"><div class="status-left"><span class="st-group">${v3Options()}</span><span class="st-dot">|</span>${where}</div>${usage}</div>${error}</div>`
}

/* ---------- Render ---------- */
const stage = document.getElementById("stage")
function render() {
  const scroll = stage.querySelector(".transcript")?.scrollTop
  stage.innerHTML = `<div class="app" data-variant="${state.variant + 1}">
    <div class="titlebar"><div class="tab">${svg.claude(12)}<span>Fix the flaky login test</span></div></div>
    <div class="transcript"><div class="column">${transcript()}</div></div>
    ${composer()}
  </div>`
  const t = stage.querySelector(".transcript")
  t.scrollTop = scroll ?? t.scrollHeight
  if (state.changes.length) t.scrollTop = t.scrollHeight
  if (state.focus) {
    const el = stage.querySelector(`[data-key="${state.focus}"]`)
    el?.focus()
    if (el?.tagName === "TEXTAREA") el.setSelectionRange(el.value.length, el.value.length)
    state.focus = null
  }
}

function openMenu(which) {
  state.menu = which
  const items = flatItems(which)
  const current = items.findIndex((it) => state.opts[it.option] === it.value)
  state.highlight = Math.max(0, current)
  state.focus = `trigger-${which}`
  render()
}
function closeMenu(refocus = true) {
  const which = state.menu
  state.menu = null
  if (refocus) state.focus = `trigger-${which}`
  render()
}
function pick(index) {
  const which = state.menu
  const item = flatItems(which)[index]
  setOption(item.option, item.value)
  if (which === "all") {
    state.highlight = index
    state.focus = "trigger-all"
    render()
  } else closeMenu()
}

stage.addEventListener("click", (e) => {
  const item = e.target.closest(".menu-item")
  if (item) return pick(Number(item.dataset.index))
  const trigger = e.target.closest("[data-menu]")
  if (trigger) return state.menu === trigger.dataset.menu ? closeMenu() : openMenu(trigger.dataset.menu)
  const action = e.target.closest("[data-action]")?.dataset.action
  if (action === "back") return goBack()
  if (action === "open-all") return openMenu("all")
  if (state.menu && !e.target.closest(".menu")) closeMenu(false)
})
stage.addEventListener("mousemove", (e) => {
  const item = e.target.closest(".menu-item")
  if (!item || Number(item.dataset.index) === state.highlight) return
  stage.querySelector(".menu-item[data-highlighted]")?.removeAttribute("data-highlighted")
  item.setAttribute("data-highlighted", "")
  state.highlight = Number(item.dataset.index)
})
stage.addEventListener("input", (e) => {
  if (e.target.matches(".field")) {
    const was = state.text.trim() === ""
    state.text = e.target.value
    if (state.scenario === "working" && was !== (state.text.trim() === "")) { state.focus = "field"; render() }
  }
})
stage.addEventListener("keydown", (e) => {
  if (state.menu) {
    const count = flatItems(state.menu).length
    const keys = { ArrowDown: 1, ArrowUp: -1 }
    if (e.key in keys) { state.highlight = (state.highlight + keys[e.key] + count) % count; state.focus = `trigger-${state.menu}`; render() }
    else if (e.key === "Home") { state.highlight = 0; state.focus = `trigger-${state.menu}`; render() }
    else if (e.key === "End") { state.highlight = count - 1; state.focus = `trigger-${state.menu}`; render() }
    else if (e.key === "Enter" || e.key === " ") pick(state.highlight)
    else if (e.key === "Escape" || e.key === "Tab") closeMenu(e.key === "Escape")
    else return
    e.preventDefault()
    e.stopPropagation()
    return
  }
  const trigger = e.target.closest("[data-menu]")
  if (trigger && (e.key === "Enter" || e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault()
    openMenu(trigger.dataset.menu)
  }
  // ⇧⌘M from the field opens the model menu (the whole menu in One summary).
  if (e.target.matches(".field") && e.shiftKey && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "m") {
    e.preventDefault()
    openMenu(state.variant === 1 ? "all" : "model")
  }
}, true)

/* ---------- Scenario switch ---------- */
const scenarioButtons = [...document.querySelectorAll("[data-scenario]")]
function setScenario(s) {
  state.scenario = s
  scenarioButtons.forEach((b) => b.toggleAttribute("data-active", b.dataset.scenario === s))
  const url = new URL(window.location)
  url.searchParams.set("s", s)
  history.replaceState(null, "", url)
  resetScenario()
  render()
}
scenarioButtons.forEach((b) => b.addEventListener("click", () => setScenario(b.dataset.scenario)))

/* ---------- Picker wiring (PICKER.md, re-mount through render) ---------- */
const variants = [0, 1, 2]
const picker = document.querySelector(".proto-picker")
const highlight = picker.querySelector(".proto-picker-highlight")
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")]
const replay = picker.querySelector(".proto-picker-replay")
let current = 0

function moveHighlight() {
  const el = items[current]
  highlight.style.width = el.offsetWidth + "px"
  highlight.style.transform = `translateX(${el.offsetLeft}px)`
}
function mount(i) {
  stage.innerHTML = ""
  requestAnimationFrame(() => { state.variant = variants[i]; resetScenario(); render() })
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return
  current = i
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i)
    if (j === i) el.setAttribute("aria-current", "true")
    else el.removeAttribute("aria-current")
  })
  moveHighlight()
  const url = new URL(window.location)
  url.searchParams.set("v", i + 1)
  history.replaceState(null, "", url)
  mount(i)
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)))
replay?.addEventListener("click", () => mount(current))
window.addEventListener("resize", moveHighlight)
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (state.menu) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= variants.length) setActive(num - 1)
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length)
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length)
  else if (e.key === "r" || e.key === "R") mount(current)
})

const params = new URLSearchParams(window.location.search)
const requestedScenario = params.get("s")
state.scenario = ["idle", "working", "failed"].includes(requestedScenario) ? requestedScenario : "idle"
scenarioButtons.forEach((b) => b.toggleAttribute("data-active", b.dataset.scenario === state.scenario))
const requested = parseInt(params.get("v"), 10)
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")))
</script>
</body>
</html>
