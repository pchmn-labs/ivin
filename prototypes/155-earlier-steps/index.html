function seed() {
  const steps = []
  for (let s = 0; s < SEED_STEPS; s++) steps.push(makeStep(s, SCRIPT[s][1].length))
  steps.push(makeStep(SEED_STEPS, SEED_CALLS))
  steps.at(-1).calls.at(-1).status = "running"
  state = { steps, cursor: [SEED_STEPS, SEED_CALLS], startAt: Date.now() - 201000, folds: new Map() }
}
function makeStep(s, count) {
  const [sentence, calls] = SCRIPT[s]
  return { id: `s${s}`, sentence, calls: calls.slice(0, count).map((c, i) => makeCall(s, i)) }
}
function makeCall(s, i) {
  const [kind, arg, end] = SCRIPT[s][1][i]
  return { id: `s${s}c${i}`, kind, arg, end: end === "error" ? "error" : "ok", status: end === "error" ? "error" : "ok" }
}

function tick() {
  const running = state.steps.at(-1).calls.at(-1)
  if (running && running.status === "running") running.status = running.end
  let [s, c] = state.cursor
  if (c >= SCRIPT[s][1].length) {
    s += 1; c = 0
    if (s >= SCRIPT.length) { seed(); render(); return }
    state.steps.push({ id: `s${s}`, sentence: SCRIPT[s][0], calls: [] })
  }
  const call = makeCall(s, c)
  call.status = "running"
  state.steps.at(-1).calls.push(call)
  state.cursor = [s, c + 1]
  render({ follow: true })
}

const phraseOf = { command: (n) => n === 1 ? "ran a command" : `ran ${n} commands`, read: (n) => `read ${n} ${n === 1 ? "file" : "files"}`, edit: (n) => `edited ${n} ${n === 1 ? "file" : "files"}`, search: (n) => n === 1 ? "searched" : `searched ${n} times`, agent: (n) => n === 1 ? "ran an agent" : `ran ${n} agents` }
function phrases(calls) {
  const counts = new Map()
  for (const call of calls) counts.set(call.kind, (counts.get(call.kind) ?? 0) + 1)
  const text = [...counts].map(([k, n]) => phraseOf[k](n)).join(" · ")
  return text.charAt(0).toUpperCase() + text.slice(1)
}
const failedOf = (calls) => calls.filter((c) => c.status === "error").length
const failedTag = (n) => n ? `<span class="faint"> · </span><span class="iv-turn__failed">${n} failed</span>` : ""
const inline = (text) => text.replace(/`([^`]+)`/g, "<code>$1</code>")
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`

function callRow(call) {
  const status = call.status === "running" ? `<span class="status">${svg(P.loader, 12, "spin")}</span>` : call.status === "error" ? `<span class="status failed">failed</span>` : ""
  return `<div class="tool">${svg(P[call.kind])}<span class="name">${NAMES[call.kind]}</span><span class="arg">${call.arg}</span>${status}</div>`
}

const chevron = `<span class="iv-turn__chevron">${svg(P.chevron, 12)}</span>`

function earlierStepsLine(hidden, open) {
  const failed = hidden.filter((s) => failedOf(s.calls) > 0).length
  const n = plural(hidden.length, "earlier step", "earlier steps")
  const attrs = `class="earlier" data-key="earlier-steps" aria-expanded="${open}" ${open ? "data-hide" : ""}`
  return `<div class="earlier-steps-row" ${open ? "data-open" : ""}><button ${attrs}><span>${open ? `Hide ${n}` : n}${failedTag(failed)}</span>${chevron}</button></div>`
}

function stepView(step, index, last, extra = "") {
  const current = index === last
  const open = state.folds.get(step.id) ?? current
  const pinned = step.calls.filter((c) => c.status === "error" || c.kind === "agent")
  const running = current && step.calls.some((c) => c.status === "running")
  if (open && step.calls.length > SHOW_CALLS) {
    return stepShell(step, current, running, open, extra, `<div class="iv-turn__calls calls-scroll" data-scroll="calls-${step.id}">${step.calls.map(wrapCall).join("")}</div>`)
  }
  const rows = (open ? step.calls : pinned).map(wrapCall).join("")
  return stepShell(step, current, running, open, extra, rows ? `<div class="iv-turn__calls">${rows}</div>` : "")
}

function stepShell(step, current, running, open, extra, calls) {
  const summary = step.calls.length === 0 ? "" : `<button class="iv-turn__summary" data-key="summary-${step.id}" aria-expanded="${open}">
      <span class="iv-turn__lead"><span class="iv-turn__mark" ${running ? 'data-state="running"' : ""}>${running ? svg(P.loader, 12, "spin") : svg(P.stack)}</span>${chevron}</span>
      <span class="iv-turn__phrases">${phrases(step.calls)}${failedTag(failedOf(step.calls))}</span></button>`
  return `<div class="iv-turn__step" data-step="${step.id}" ${extra} ${failedOf(step.calls) ? "data-failed" : ""} ${current ? "data-current" : ""}>
    <div class="iv-turn__sentence prose"><p>${inline(step.sentence)}</p></div>${summary}
    ${calls}</div>`
}
const wrapCall = (call) => `<div class="iv-turn__call" data-call="${call.id}">${callRow(call)}</div>`

function turnLine() {
  const seconds = Math.round((Date.now() - state.startAt) / 1000)
  const failed = state.steps.reduce((n, s) => n + failedOf(s.calls), 0)
  const time = seconds >= 60 ? `${Math.floor(seconds / 60)}m ${seconds % 60}s` : `${seconds}s`
  return `<span class="iv-turn__lead"><span class="iv-turn__mark">${svg(P.loader, 12, "spin")}</span></span>
    <span class="iv-turn__label">Working for <span id="clock">${time}</span>${failedTag(failed)}</span><span class="iv-turn__rule"></span>`
}

const stage = document.getElementById("stage")
const scroller = document.getElementById("scroller")

function render({ follow = false, anchor = null } = {}) {
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 4
  const before = anchor && document.querySelector(anchor)?.getBoundingClientRect().top
  const focusKey = document.activeElement?.matches(":focus-visible") ? document.activeElement.dataset.key : null
  const last = state.steps.length - 1
  const scrolls = new Map([...stage.querySelectorAll("[data-scroll]")].map((el) => [el.dataset.scroll, { top: el.scrollTop, atBottom: el.scrollHeight - el.scrollTop - el.clientHeight < 4 }]))
  const hidden = state.steps.slice(0, Math.max(0, state.steps.length - SHOW_STEPS))
  const stepsOpen = state.folds.get("steps") ?? false
  const head = hidden.length ? earlierStepsLine(hidden, stepsOpen) : ""
  const earlier = stepsOpen ? hidden.map((step, i) => stepView(step, i, last, i === hidden.length - 1 ? "data-earlier data-earlier-last" : "data-earlier")).join("") : ""
  const shown = state.steps.slice(hidden.length).map((step, i) => stepView(step, hidden.length + i, last)).join("")
  const timeline = head + earlier + shown
  syncLoops()
  stage.className = `column ${["v-run", "v-stay", "v-range"][variant]}`
  stage.innerHTML = `
    <div class="item bubble-row"><div class="bubble">The checkout total is wrong when a discount code is applied: a 10% code on a 50 € cart with 20% VAT shows 55 € instead of 54 €. Can you find out why and fix it?</div></div>
    <div class="item"><div class="iv-turn"><div class="iv-turn__line" aria-expanded="true">${turnLine()}</div>
      <div class="iv-turn__timeline">${timeline}</div></div></div>
    <div class="footer"></div>`
  for (const el of stage.querySelectorAll("[data-scroll]")) {
    const prior = scrolls.get(el.dataset.scroll)
    el.scrollTop = prior && !prior.atBottom ? prior.top : el.scrollHeight
  }
  if (focusKey) stage.querySelector(`[data-key="${focusKey}"]`)?.focus({ preventScroll: true })
  if (anchor && before != null) {
    const after = document.querySelector(anchor)?.getBoundingClientRect().top
    if (after != null) scroller.scrollTop += after - before
  } else if (follow && atBottom) scroller.scrollTop = scroller.scrollHeight
}

stage.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-key]")
  if (!btn) return
  const key = btn.dataset.key
  let foldKey
  const anchor = `[data-key="${key}"]`
  if (key === "earlier-steps") foldKey = "steps"
  else foldKey = key.slice("summary-".length)
  const open = btn.getAttribute("aria-expanded") === "true"
  state.folds.set(foldKey, !open)
  render({ anchor })
})

function start() {
  clearInterval(timer); clearInterval(clock)
  if (playing) timer = setInterval(tick, 1100)
  clock = setInterval(() => { const el = document.getElementById("clock"); if (el) { syncLoops(); el.parentElement.parentElement.innerHTML = turnLine() } }, 1000)
}
const playBtn = document.getElementById("play")
function togglePlay() { playing = !playing; playBtn.setAttribute("aria-pressed", playing); playBtn.textContent = playing ? "Streaming" : "Paused"; start() }
playBtn.addEventListener("click", togglePlay)

function mount() {
  seed()
  render()
  scroller.scrollTop = scroller.scrollHeight
  start()
}

// Picker wiring, from PICKER.md
const picker = document.querySelector(".proto-picker")
const highlight = picker.querySelector(".proto-picker-highlight")
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")]
const replay = picker.querySelector(".proto-picker-replay")
function moveHighlight() {
  const el = items[variant]
  highlight.style.width = el.offsetWidth + "px"
  highlight.style.transform = `translateX(${el.offsetLeft}px)`
}
function setActive(i) {
  if (i < 0 || i >= items.length) return
  variant = i
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i)
    if (j === i) el.setAttribute("aria-current", "true")
    else el.removeAttribute("aria-current")
  })
  moveHighlight()
  const url = new URL(location)
  url.searchParams.set("v", i + 1)
  history.replaceState(null, "", url)
  requestAnimationFrame(mount)
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)))
replay.addEventListener("click", () => mount())
window.addEventListener("resize", moveHighlight)
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= items.length) setActive(num - 1)
  else if (e.key === "ArrowRight") setActive((variant + 1) % items.length)
  else if (e.key === "ArrowLeft") setActive((variant - 1 + items.length) % items.length)
  else if (e.key === "r" || e.key === "R") mount()
  else if (e.key === "p" || e.key === "P") togglePlay()
})
const requested = parseInt(new URLSearchParams(location.search).get("v"), 10)
setActive(requested >= 1 && requested <= items.length ? requested - 1 : 0)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")))
</script>
</body>
</html>
