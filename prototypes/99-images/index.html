  branch: '<svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor"><path d="M232 64a32 32 0 1 0-40 31v9a16 16 0 0 1-16 16H96a31.71 31.71 0 0 0-16 4.31V95a32 32 0 1 0-16 0v66a32 32 0 1 0 16 0v-9a16 16 0 0 1 16-16h80a32 32 0 0 0 32-32v-9a32.06 32.06 0 0 0 24-31ZM56 64a16 16 0 1 1 16 16 16 16 0 0 1-16-16Zm32 128a16 16 0 1 1-16-16 16 16 0 0 1 16 16Zm112-112a16 16 0 1 1 16-16 16 16 0 0 1-16 16Z"/></svg>',
}


ic.image = '<svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor"><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16Zm0 16v102.75l-26.07-26.06a16 16 0 0 0-22.63 0l-20 20-44-44a16 16 0 0 0-22.62 0L40 149.37V56ZM40 172l52-52 80 80H40Zm176 28h-21.37l-36-36 20-20L216 181.38V200Zm-72-100a12 12 0 1 1 12 12 12 12 0 0 1-12-12Z"/></svg>'

const LIMIT = 5 * 1024 * 1024
const ACCEPTED = ["image/png", "image/jpeg", "image/gif", "image/webp"]
const MARKER = /\[Image #(\d+)\]/g
const markerOf = (n) => `[Image #${n}]`

let nextId = 1
const image = (key, number) => ({ id: `img-${nextId++}`, number, ...SHOTS[key] })

const initialState = () => ({
  messages: [
    { role: "user", text: "The login button overflows its card on narrow widths: [Image #1]\nCan you fix it?", images: [image("login", 1)] },
    { role: "assistant", html: "<p>The card is 360px wide but the button keeps <code>min-width: 400px</code> from the old theme. I'll drop the min-width so the button fills the card.</p>" },
    { role: "tool", html: '<span class="dot"></span><b>Edit</b><code>src/auth/login-card.css</code>' },
    { role: "assistant", html: "<p>Done: the button now fills the card at every width.</p>" },
    { role: "user", text: "Thanks. Now a test fails: [Image #2]\nthe chart labels overlap on the dashboard [Image #3] and on mobile the settings rows get cut [Image #4]", images: [image("terminal", 2), image("chart", 3), image("phone", 4)] },
    { role: "assistant", html: "<p>Three separate problems. The test first: <code>data</code> is <code>undefined</code> while the first page loads, so <code>data.items.map</code> throws. I'll default to an empty list, then rotate the chart labels and let the settings rows wrap.</p>" },
  ],
  // Every image pasted into this draft, kept so that undoing a deleted marker brings its image back.
  pool: [image("diff", 5)],
  text: "Here's the login card after your change: [Image #5]\nThe button fits now, but the spacing above it looks off.",
  error: null,
})

let state = initialState()

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const mb = (bytes) => bytes >= 1_000_000 ? `${(bytes / 1_000_000).toFixed(1)} MB` : `${Math.round(bytes / 1000)} KB`
const $ = (sel) => document.querySelector(sel)

const sessionImages = () => state.messages.flatMap((m) => m.images ?? [])
const nextNumber = () => Math.max(0, ...sessionImages().map((i) => i.number), ...state.pool.map((i) => i.number)) + 1
const findImage = (id) => sessionImages().find((i) => i.id === id) ?? state.pool.find((i) => i.id === id)

function draftImages() {
  const seen = new Set()
  const out = []
  for (const [, n] of state.text.matchAll(MARKER)) {
    const img = state.pool.find((i) => i.number === Number(n))
    if (img && !seen.has(img.id)) { seen.add(img.id); out.push(img) }
  }
  return out
}

function pieces(text, images) {
  const out = []
  let at = 0
  for (const match of text.matchAll(MARKER)) {
    if (match.index > at) out.push({ text: text.slice(at, match.index) })
    const img = images.find((i) => i.number === Number(match[1]))
    out.push(img ? { img } : { text: match[0] })
    at = match.index + match[0].length
  }
  if (at < text.length) out.push({ text: text.slice(at) })
  return out
}

const thumb = (img, source) =>
  `<button class="thumb" data-open="${img.id}" data-source="${source}" aria-label="View image #${img.number}, ${esc(img.name)}"><img src="${img.url}" alt="" loading="lazy" decoding="async"></button>`

const LOOKS = [
  (img) => markerOf(img.number),
  (img) => `${ic.image}Image ${img.number}`,
  (img) => `<img src="${img.url}" alt="">#${img.number}`,
]
const markerButton = (img) => `<button class="marker" data-open="${img.id}" data-source="session" data-number="${img.number}" aria-label="View image #${img.number}">${LOOKS[current](img)}</button>`
const markerSpan = (img) => `<span class="marker" contenteditable="false" data-open="${img.id}" data-source="draft" data-number="${img.number}">${LOOKS[current](img)}</span>`

const bubble = (m) => `<div class="bubble">${m.images.length ? `<div class="bubble-shots">${m.images.map((img) => `<span class="bubble-shot" data-number="${img.number}">${thumb(img, "session")}<span class="bubble-shot-number">#${img.number}</span></span>`).join("")}</div>` : ""}<div class="bubble-text">${pieces(m.text, m.images).map((p) => p.img ? markerButton(p.img) : esc(p.text)).join("")}</div></div>`

function shell() {
  return `
  <div class="app">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="titlebar"><div class="tab"><span class="mark"></span>Fix login card overflow</div></div>
    <div class="transcript" id="transcript"><div class="column" id="items"></div></div>
    <div class="composer" id="composer">
      <div class="alert" id="alert"></div>
      <div class="surface" id="surface">
        <div class="attachments" id="attachments" aria-label="Images in this message"></div>
        <div class="editor" id="editor">
          <div class="placeholder" aria-hidden="true">Message Claude</div>
          <div class="field" id="field" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message"></div>
        </div>
        <div class="row">
          <span class="model"><span class="mark" style="width:14px;height:14px"></span>sonnet</span>
          <button class="icon-btn primary" id="send" aria-label="Send">${ic.send}</button>
        </div>
      </div>
      <div class="statusline"><span class="mono">${ic.branch} fix/login-card-overflow</span><span>12.4k tokens · $0.08</span></div>
    </div>
  </div>
  <div class="peek" id="peek" aria-hidden="true"><img alt=""><div class="peek-name"></div></div>`
}

let current = 0

// ---------- The editor: text with atomic markers ----------
const editorHtml = (text) =>
  pieces(text, state.pool).map((p) => p.img ? markerSpan(p.img) : esc(p.text).replace(/\n/g, "<br>")).join("") + (text.endsWith("\n") ? "<br>" : "")

// Chrome wraps lines typed after Enter in divs and ends the content with a <br>.
function serialize(node) {
  let out = ""
  node.childNodes.forEach((child, i) => {
    if (child.nodeType === Node.TEXT_NODE) out += child.nodeValue.replace(/ /g, " ")
    else if (child.matches?.(".marker")) out += markerOf(child.dataset.number)
    else if (child.nodeName === "BR") out += i === node.childNodes.length - 1 && node === $("#field") ? "" : "\n"
    else if (child.nodeName === "DIV" || child.nodeName === "P") out += (out === "" || out.endsWith("\n") ? "" : "\n") + serialize(child)
    else out += serialize(child)
  })
  return out
}

function syncFromEditor() {
  state.text = serialize($("#field"))
  renderAttachments()
  $("#editor").toggleAttribute("data-empty", state.text === "")
  $("#send").disabled = state.text.trim() === ""
}

function caretInField() {
  const sel = getSelection()
  return sel.rangeCount > 0 && $("#field").contains(sel.getRangeAt(0).startContainer)
}

function placeCaretAtEnd() {
  const field = $("#field")
  field.focus()
  const range = document.createRange()
  range.selectNodeContents(field)
  range.collapse(false)
  getSelection().removeAllRanges(); getSelection().addRange(range)
}

function charBeforeCaret() {
  const range = getSelection().getRangeAt(0)
  const { startContainer: node, startOffset: offset } = range
  if (node.nodeType === Node.TEXT_NODE) return offset > 0 ? node.nodeValue[offset - 1] : (node.previousSibling ? "x" : "")
  const before = node.childNodes[offset - 1]
  if (!before) return ""
  if (before.nodeName === "BR") return "\n"
  return before.nodeType === Node.TEXT_NODE ? before.nodeValue.at(-1) ?? "" : "x"
}

function insertMarkers(images) {
  if (!caretInField()) placeCaretAtEnd()
  const lead = /^$|\s/.test(charBeforeCaret()) ? "" : " "
  // execCommand keeps the insertion on the editor's undo stack.
  const range = getSelection().getRangeAt(0)
  const after = range.endContainer.nodeType === Node.TEXT_NODE ? range.endContainer.nodeValue.slice(range.endOffset, range.endOffset + 1) : ""
  const trail = /^[\s\u00a0]/.test(after) ? "" : "&nbsp;"
  document.execCommand("insertHTML", false, lead + images.map((img) => markerSpan(img).replace("<span ", "<span data-new ")).join(" ") + trail)
  // Chrome leaves the caret inside the text after a non-editable element: put it after the last marker and its space.
  const inserted = [...$("#field").querySelectorAll("[data-new]")]
  inserted.forEach((n) => n.removeAttribute("data-new"))
  const last = inserted.at(-1)
  if (!last) return
  const caret = document.createRange()
  const next = last.nextSibling
  if (next?.nodeType === Node.TEXT_NODE && /^[\s\u00a0]/.test(next.nodeValue)) caret.setStart(next, 1)
  else caret.setStartAfter(last)
  caret.collapse(true)
  getSelection().removeAllRanges(); getSelection().addRange(caret)
}

function renderAttachments() {
  $("#attachments").innerHTML = draftImages().map((img) =>
    `<div class="attachment" data-number="${img.number}">${thumb(img, "draft")}<button class="attachment-remove" data-remove="${img.number}" aria-label="Remove image #${img.number}">${ic.x}</button></div>`).join("")
}

function renderItems() {
  $("#items").innerHTML = state.messages.map((m) =>
    m.role === "user" ? `<div class="item">${bubble(m)}</div>`
    : m.role === "tool" ? `<div class="item tool">${m.html}</div>`
    : `<div class="item">${m.html}</div>`).join("")
}

function renderAlert() {
  $("#alert").innerHTML = state.error ? `<div class="error" role="alert">${ic.alert}<span>${esc(state.error)}</span></div>` : ""
}

function renderAll() {
  renderItems(); renderAlert()
  $("#field").innerHTML = editorHtml(state.text)
  syncFromEditor()
  const t = $("#transcript"); t.scrollTop = t.scrollHeight
}

function addFiles(files) {
  const refused = []
  const added = []
  for (const file of files) {
    if (!ACCEPTED.includes(file.type)) refused.push(`${file.name || "That file"} is not an image Claude can read. Use PNG, JPEG, GIF or WebP.`)
    else if (file.size > LIMIT) refused.push(`${file.name || "That image"} is ${mb(file.size)}; Claude takes images up to 5 MB.`)
    else {
      const img = { id: `img-${nextId++}`, number: nextNumber(), name: file.name || "Pasted image.png", size: file.size, url: URL.createObjectURL(file) }
      state.pool.push(img)
      added.push(img)
    }
  }
  state.error = refused.length === 0 ? null : refused.length === 1 ? refused[0] : `${refused.length} files were not added: only PNG, JPEG, GIF or WebP images up to 5 MB.`
  if (added.length) insertMarkers(added)
  renderAlert()
}

function removeImage(number) {
  const field = $("#field")
  field.focus()
  for (const marker of field.querySelectorAll(`.marker[data-number="${number}"]`)) {
    const range = document.createRange()
    range.selectNode(marker)
    const next = marker.nextSibling
    if (next?.nodeType === Node.TEXT_NODE && /^[  ]/.test(next.nodeValue)) range.setEnd(next, 1)
    getSelection().removeAllRanges(); getSelection().addRange(range)
    document.execCommand("delete")
  }
  state.error = null
  renderAlert()
}

function send() {
  if (state.text.trim() === "") return
  state.messages.push({ role: "user", text: state.text.trim(), images: draftImages() })
  state.pool = []; state.text = ""; state.error = null
  renderAll()
  $("#field").focus()
}

// ---------- Full-screen view (Filmstrip) ----------
let viewer = null

function openViewer(trigger) {
  const source = trigger.dataset.source
  const list = source === "draft" ? draftImages() : sessionImages()
  const index = list.findIndex((img) => img.id === trigger.dataset.open)
  viewer = { list, index, source, trigger }
  const groups = source === "draft" ? [list] : state.messages.filter((m) => m.images?.length).map((m) => m.images)
  const el = document.createElement("div")
  el.className = "viewer"
  el.setAttribute("role", "dialog")
  el.setAttribute("aria-modal", "true")
  el.setAttribute("aria-label", "Images")
  el.innerHTML = `
    <div class="viewer-head"><span class="viewer-count"></span><span class="viewer-from"></span><button class="icon-btn ghost" data-close aria-label="Close (Esc)">${ic.x16}</button></div>
    <div class="viewer-stage">
      <button class="icon-btn ghost viewer-nav viewer-prev" data-step="-1" aria-label="Previous image">${ic.left}</button>
      <img class="viewer-img">
      <button class="icon-btn ghost viewer-nav viewer-next" data-step="1" aria-label="Next image">${ic.right}</button>
    </div>
    <div class="strip">${groups.map((g) => g.map((img) => `<button class="thumb" data-jump="${img.id}" aria-label="Image #${img.number}"><img src="${img.url}" alt=""></button>`).join("")).join('<span class="strip-sep"></span>')}</div>`
  viewer.el = el
  $(".app").appendChild(el)
  showViewer()
  el.querySelector("[data-close]").focus()
}

function showViewer() {
  const { list, index, el, source } = viewer
  const img = list[index]
  el.querySelector(".viewer-img").src = img.url
  el.querySelector(".viewer-img").alt = `Image #${img.number}`
  el.querySelector(".viewer-count").textContent = `Image #${img.number} · ${index + 1} of ${list.length}`
  const message = state.messages.find((m) => m.images?.includes(img))
  el.querySelector(".viewer-from").textContent = `${img.name} · ${source === "draft" ? "Not sent yet" : `From your message: “${message.text.replace(MARKER, "").replace(/\s+/g, " ").trim()}”`}`
  el.querySelector(".viewer-prev").disabled = index === 0
  el.querySelector(".viewer-next").disabled = index === list.length - 1
  el.querySelectorAll(".strip .thumb").forEach((t) => {
    const on = t.dataset.jump === img.id
    t.setAttribute("aria-current", on ? "true" : "false")
    if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" })
  })
}

function step(delta) {
  const next = viewer.index + delta
  if (next < 0 || next >= viewer.list.length) return
  viewer.index = next
  showViewer()
}

function closeViewer() {
  const { el, list, index, trigger } = viewer
  el.remove()
  viewer = null
  const shown = list[index].id
  // A marker in the editor is not focusable: the caret goes back right after it.
  if (trigger.isConnected && trigger.closest("#field")) {
    const field = $("#field")
    field.focus()
    const range = document.createRange()
    range.setStartAfter(trigger); range.collapse(true)
    getSelection().removeAllRanges(); getSelection().addRange(range)
    return
  }
  const back = trigger.isConnected && trigger.dataset.open === shown ? trigger : document.querySelector(`button[data-open="${shown}"]`)
  back?.focus()
}

window.addEventListener("keydown", (e) => {
  if (!viewer) return
  if (e.key === "Escape") { e.preventDefault(); closeViewer() }
  else if (e.key === "ArrowLeft") step(-1)
  else if (e.key === "ArrowRight") step(1)
  else if (e.key === "Tab") {
    const focusable = [...viewer.el.querySelectorAll("button:not(:disabled)")]
    const i = focusable.indexOf(document.activeElement)
    const n = e.shiftKey ? (i <= 0 ? focusable.length - 1 : i - 1) : (i + 1) % focusable.length
    focusable[n].focus(); e.preventDefault()
  } else return
  e.stopImmediatePropagation()
}, true)

// ---------- Hover: preview a marker, link it with its thumbnail ----------
function showPeek(marker) {
  const img = findImage(marker.dataset.open)
  const peek = $("#peek")
  peek.querySelector("img").src = img.url
  peek.querySelector(".peek-name").textContent = `Image #${img.number} · ${img.name}`
  const r = marker.getBoundingClientRect()
  peek.style.left = `${Math.min(r.left, innerWidth - 256)}px`
  peek.style.top = `${r.top - 8}px`
  peek.style.translate = "0 -100%"
  peek.setAttribute("data-shown", "")
}
const hidePeek = () => $("#peek")?.removeAttribute("data-shown")

let hot = null
function setHot(scope, number) {
  if (hot?.scope === scope && hot?.number === number) return
  document.querySelectorAll("[data-hot]").forEach((n) => n.removeAttribute("data-hot"))
  hot = number ? { scope, number } : null
  if (!hot) return
  scope.querySelectorAll(`[data-number="${number}"]`).forEach((n) => {
    n.setAttribute("data-hot", "")
    n.closest(".attachment")?.setAttribute("data-hot", "")
  })
}

// ---------- Wiring ----------
function wire() {
  const stage = $("#stage")
  const field = $("#field")
  field.addEventListener("input", syncFromEditor)
  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send() }
    else if (e.key === "Enter") { e.preventDefault(); document.execCommand("insertLineBreak") }
  })
  field.addEventListener("paste", (e) => {
    e.preventDefault()
    const files = [...e.clipboardData.files]
    if (files.length) addFiles(files)
    else document.execCommand("insertText", false, e.clipboardData.getData("text/plain"))
  })
  $("#send").addEventListener("click", send)

  const surface = $("#surface")
  let depth = 0
  surface.addEventListener("dragenter", (e) => { if (!e.dataTransfer.types.includes("Files")) return; e.preventDefault(); if (depth++ === 0) surface.setAttribute("data-dragging", "") })
  surface.addEventListener("dragover", (e) => { if (e.dataTransfer.types.includes("Files")) e.preventDefault() })
  surface.addEventListener("dragleave", () => { if (--depth === 0) surface.removeAttribute("data-dragging") })
  surface.addEventListener("drop", (e) => {
    e.preventDefault(); depth = 0; surface.removeAttribute("data-dragging")
    // The image lands where the caret would go under the pointer.
    const range = field.contains(e.target) ? document.caretRangeFromPoint?.(e.clientX, e.clientY) : null
    if (range) { field.focus(); getSelection().removeAllRanges(); getSelection().addRange(range) }
    addFiles([...e.dataTransfer.files])
  })

  stage.addEventListener("mouseover", (e) => {
    const marker = e.target.closest(".marker")
    marker ? showPeek(marker) : hidePeek()
    const linked = e.target.closest(".marker, .attachment, .bubble-shot")
    const scope = linked?.closest("#composer, .bubble")
    setHot(scope, linked ? Number(linked.dataset.number) : null)
  })
  $("#items").addEventListener("focusin", (e) => { if (e.target.matches(".marker")) showPeek(e.target) })
  $("#items").addEventListener("focusout", hidePeek)
  $("#transcript").addEventListener("scroll", hidePeek)

  stage.addEventListener("click", (e) => {
    const open = e.target.closest("[data-open]")
    const remove = e.target.closest("[data-remove]")
    const stepBtn = e.target.closest("[data-step]")
    const jump = e.target.closest("[data-jump]")
    if (e.target.closest("[data-close]")) closeViewer()
    else if (stepBtn) step(Number(stepBtn.dataset.step))
    else if (jump) { viewer.index = viewer.list.findIndex((i) => i.id === jump.dataset.jump); showViewer() }
    else if (remove) removeImage(Number(remove.dataset.remove))
    else if (open && !viewer) { e.preventDefault(); hidePeek(); openViewer(open) }
  })
}

window.addEventListener("dragover", (e) => e.preventDefault())
window.addEventListener("drop", (e) => e.preventDefault())

const variants = [0, 1, 2].map((v) => () => { current = v; return shell() })

// ---------- Picker wiring (PICKER.md, keyed re-mount) ----------
const stage = document.getElementById("stage")
const picker = document.querySelector(".proto-picker")
const highlight = picker.querySelector(".proto-picker-highlight")
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")]
const replay = picker.querySelector(".proto-picker-replay")
let active = 0

function moveHighlight() {
  const el = items[active]
  highlight.style.width = el.offsetWidth + "px"
  highlight.style.transform = `translateX(${el.offsetLeft}px)`
}

function mount(i) {
  viewer = null; hot = null
  stage.innerHTML = ""
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i]()
    stage.dataset.variant = String(i + 1)
    wire()
    renderAll()
  })
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return
  active = i
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i)
    if (j === i) el.setAttribute("aria-current", "true")
    else el.removeAttribute("aria-current")
  })
  moveHighlight()
  const url = new URL(location)
  url.searchParams.set("v", i + 1)
  history.replaceState(null, "", url)
  mount(i)
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)))
replay?.addEventListener("click", () => { state = initialState(); mount(active) })
window.addEventListener("resize", moveHighlight)

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= variants.length) setActive(num - 1)
  else if (e.key === "ArrowRight") setActive((active + 1) % variants.length)
  else if (e.key === "ArrowLeft") setActive((active - 1 + variants.length) % variants.length)
  else if (e.key === "r" || e.key === "R") { state = initialState(); mount(active) }
})

const requested = parseInt(new URLSearchParams(location.search).get("v"), 10)
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")))
</script>
</body>
