  return t.charAt(0).toUpperCase() + t.slice(1)
}
const duration = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s` }

const SCRIPT = [
  ["I'll start by reading the checkout flow to see where the total is computed.", [["read", "src/checkout/summary.tsx"], ["read", "src/cart/cart-store.ts"], ["search", "applyDiscount"]]],
  ["The total comes from `cart-store.ts`. Let me check how discounts are applied.", [["read", "src/lib/currency.ts"], ["read", "src/cart/discounts.ts"]]],
  ["Discounts are applied after tax, which explains the wrong total. I'll add a failing test first.", [["edit", "src/cart/cart-store.test.ts"], ["command", "pnpm test src/cart/cart-store.test.ts"]]],
  ["The new test fails as expected. Now I'll move the discount before tax.", [["edit", "src/cart/cart-store.ts"], ["command", "pnpm test src/cart"]]],
  ["Two other tests assumed the old order. I'll update their expected totals.", [["read", "src/cart/totals.test.ts"], ["edit", "src/cart/totals.test.ts"], ["command", "pnpm test src/cart src/checkout"]]],
  ["`summary.tsx` recomputes the total on its own. I'll make it call the store.", [["edit", "src/checkout/summary.tsx"], ["command", "pnpm typecheck"]]],
  ["Everything passes. Running the whole suite once more.", [["command", "pnpm test"], ["command", "pnpm lint"]]],
]
const REPLIES = [
  "Noted, I'll do that once the cart tests pass.",
  "Understood. I'll take that into account for the rest of the fix.",
]
const NEXT_TURN = [
  ["Switching to what you asked. Let me look at the cart page.", [["read", "src/cart/cart-page.tsx"], ["search", "formatTotal"]]],
  ["The cart page uses the same store function, so it shows the right total now.", [["command", "pnpm test src/cart"]]],
]

let state, timer, clock, variant = 0, playing = true, reply = 0
const PROMPT = "The checkout total is wrong when a discount code is applied: a 10% code on a 50 € cart with 20% VAT shows 55 € instead of 54 €. Can you find out why and fix it?"

const mkCall = (kind, arg, status = "ok") => ({ id: crypto.randomUUID(), kind, arg, status })
function seed() {
  const steps = [
    { id: "a", sentence: SCRIPT[0][0], calls: SCRIPT[0][1].map(([k, a]) => mkCall(k, a)) },
    { id: "b", steer: { text: "Keep the rounding helper as it is, other pages use it." }, sentence: "Understood, I won't touch the rounding helper. The total comes from `cart-store.ts`.", calls: SCRIPT[1][1].map(([k, a]) => mkCall(k, a)) },
    { id: "c", sentence: SCRIPT[2][0], calls: [mkCall("edit", SCRIPT[2][1][0][1]), mkCall("command", SCRIPT[2][1][1][1], "running")] },
  ]
  state = {
    turns: [{ user: PROMPT, steps, startAt: Date.now() - 74000, endAt: null, outcome: null, script: SCRIPT, cursor: [2, 2], answer: null }],
    pending: [],
    fresh: new Set(),
  }
}
const turn = () => state.turns.at(-1)
const working = () => turn().endAt === null

// The agent reads its waiting messages when a tool call ends, as Claude Code does.
function tick() {
  const t = turn()
  if (!working()) return
  const running = t.steps.at(-1)?.calls.at(-1)
  if (running?.status === "running") running.status = "ok"
  if (state.pending.length) {
    for (const m of state.pending) { t.steps.push({ id: m.id, steer: { text: m.text }, sentence: null, calls: [] }); state.fresh.add(m.id) }
    t.steps.at(-1).sentence = REPLIES[reply++ % REPLIES.length]
    state.pending = []
    render({ follow: true })
    return
  }
  let [s, c] = t.cursor
  if (s >= t.script.length || c >= t.script[s][1].length) {
    s += 1; c = 0
    if (s >= t.script.length) { finish("answered"); return }
    t.steps.push({ id: crypto.randomUUID(), sentence: t.script[s][0], calls: [] })
  }
  const [kind, arg] = t.script[s][1][c]
  t.steps.at(-1).calls.push(mkCall(kind, arg, "running"))
  t.cursor = [s, c + 1]
  render({ follow: true })
}

function finish(outcome) {
  const t = turn()
  const running = t.steps.at(-1)?.calls.at(-1)
  if (running?.status === "running") running.status = "ok"
  t.endAt = Date.now(); t.outcome = outcome
  if (outcome === "answered") t.answer = "The discount is now applied before tax, so the 50 € cart with a 10% code and 20% VAT totals 54 €. I added a test for it and updated the two tests that encoded the old order."
  render({ follow: true })
}

function startTurn(messages) {
  const [first, ...rest] = messages
  // Read together at the start of a turn, the first message starts it and the others steer it.
  const steps = rest.map((m) => ({ id: m.id, steer: { text: m.text }, sentence: null, calls: [] }))
  if (steps.length) steps.at(-1).sentence = NEXT_TURN[0][0]
  else steps.push({ id: crypto.randomUUID(), sentence: NEXT_TURN[0][0], calls: [] })
  state.turns.push({ user: first.text, steps, startAt: Date.now(), endAt: null, outcome: null, script: NEXT_TURN, cursor: [0, 0], answer: null })
  render({ follow: true, toEnd: true })
}

function send() {
  const field = document.getElementById("field")
  const text = field.value.trim()
  if (!text) return
  field.value = ""
  const m = { id: crypto.randomUUID(), text }
  if (working()) state.pending.push(m), state.fresh.add(m.id)
  else startTurn([m])
  render({ follow: true, toEnd: true })
  field.focus()
}
function sendNow() {
  const messages = state.pending
  state.pending = []
  finish("stopped")
  startTurn(messages)
}
function stop() {
  const field = document.getElementById("field")
  const back = state.pending.map((m) => m.text).join("\n\n")
  state.pending = []
  finish("stopped")
  if (back && field.value === "") field.value = back
  composerView()
  field.focus()
}

const callRow = (c) => `<div class="iv-turn__call"><div class="tool">${svg(P[c.kind])}<span class="name">${NAMES[c.kind]}</span><span class="arg">${esc(c.arg)}</span>${c.status === "running" ? `<span class="status">${svg(P.loader, 12, "spin")}</span>` : ""}</div></div>`

function steerBlock(step, pending) {
  const text = esc(step.steer.text)
  if (variant === 0) return `<div class="steer-bubble">${text}</div>`
  if (variant === 1) return `<span class="steer-mark">${svg(P.bend, 14)}</span><div class="steer-text">${text}</div>${pending === "last" ? `<div class="steer-note">${svg(P.clock, 12)}<span>${state.pending.length === 1 ? "Waiting for the agent to read it" : "Waiting for the agent to read them"}</span><span>·</span><button class="iv-button" data-act="now" title="Stops this turn and sends your messages">Send now</button></div>` : ""}`
  return `<div class="steer-quote">${text}</div>`
}

function stepView(step, current) {
  const running = current && step.calls.some((c) => c.status === "running")
  const fresh = state.fresh.has(step.id)
  const sentence = step.sentence ? `<div class="iv-turn__sentence prose"><p>${inline(step.sentence)}</p></div>` : ""
  const summary = step.calls.length ? `<div class="iv-turn__summary"><span class="iv-turn__lead">${running ? svg(P.loader, 12, "spin") : svg(P.stack)}</span><span>${phrases(step.calls)}</span></div>` : ""
  const calls = current && step.calls.length ? `<div class="iv-turn__calls">${step.calls.map(callRow).join("")}</div>` : ""
  return `<div class="iv-turn__step ${fresh ? "rise" : ""}" ${step.steer ? "data-steer" : ""} ${step.pending ? "data-pending" : ""} ${current && !step.pending ? "data-current" : ""}>
    ${step.steer ? steerBlock(step, step.pending) : ""}${sentence}${summary}${calls}</div>`
}

function turnView(t, index) {
  const live = t.endAt === null
  const verb = live ? "Working for" : t.outcome === "stopped" ? "Stopped after" : "Worked for"
  const calls = t.steps.reduce((n, s) => n + s.calls.length, 0)
  const lead = live ? svg(P.loader, 12, "spin") : t.outcome === "stopped" ? `<span style="display:block;width:9px;height:9px;border-radius:2px;background:currentColor"></span>` : svg(P.check)
  const label = live ? `${verb} <span data-clock="${index}">${duration(Date.now() - t.startAt)}</span>` : `${verb} ${duration(t.endAt - t.startAt)} · ${calls} tool calls`
  let steps = t.steps
  // In the timeline, a message not read yet is a step already, after the running one.
  if (variant === 1 && live) steps = [...steps, ...state.pending.map((m, i) => ({ id: m.id, steer: { text: m.text }, pending: i === state.pending.length - 1 ? "last" : "yes", calls: [] }))]
  const lastReal = t.steps.length - 1
  const timeline = steps.map((s, i) => stepView(s, live && i === lastReal)).join("")
  return `<div class="item"><div class="bubble">${esc(t.user)}</div></div>
    <div class="item"><div class="iv-turn"><div class="iv-turn__line"><span class="iv-turn__lead">${lead}</span><span class="iv-turn__label">${label}</span><span class="iv-turn__rule"></span></div>
    <div class="iv-turn__timeline">${timeline}</div></div></div>
    ${t.answer ? `<div class="item prose rise"><p>${esc(t.answer)}</p></div>` : ""}`
}

function composerView() {
  const above = document.getElementById("above")
  const tray = document.getElementById("tray")
  const n = state.pending.length
  above.innerHTML = variant === 0 && n && working() ? `<div class="iv-action-sheet" role="status">
      <div class="iv-action-sheet__head">${svg(P.clock)}<span>${n === 1 ? "Sent to the agent" : `${n} messages sent to the agent`}</span></div>
      <div class="pending-list">${state.pending.map((m) => `<div class="pending-item" title="${esc(m.text)}">${esc(m.text)}</div>`).join("")}</div>
      <div class="sheet-row"><span class="sheet-hint">The agent reads ${n === 1 ? "it" : "them"} when its current tool call ends. Stop puts ${n === 1 ? "it" : "them"} back here.</span><button class="iv-button" data-act="now" title="Stops this turn and sends your messages">Send now</button></div>
    </div>` : ""
  tray.innerHTML = variant === 2 && n && working() ? `<div class="tray" role="status">${state.pending.map((m, i) => `<div class="tray-row" title="${esc(m.text)}">${svg(P.clock, 12)}<span class="text">${esc(m.text)}</span>${i === n - 1 ? `<span class="faint" style="font-size:var(--iv-text-xs)">Waits for the current tool call</span><button class="iv-button" data-act="now" title="Stops this turn and sends your messages">Send now</button>` : ""}</div>`).join("")}</div>` : ""
  const field = document.getElementById("field")
  const action = document.getElementById("action")
  const empty = field.value.trim() === ""
  action.innerHTML = working() && empty
    ? `<button class="round stop" data-act="stop" aria-label="Interrupt"><span style="display:block;width:9px;height:9px;border-radius:2px;background:currentColor"></span></button>`
    : `<button class="round send" data-act="send" aria-label="Send" ${empty ? "disabled" : ""}>${svg(P.up)}</button>`
  document.getElementById("tabdot").toggleAttribute("data-idle", !working())
}

const stage = document.getElementById("stage")
const scroller = document.getElementById("scroller")
function render({ follow = false, toEnd = false } = {}) {
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40
  syncLoops()
  stage.className = `column ${["v-sheet", "v-line", "v-tray"][variant]}`
  stage.innerHTML = state.turns.map(turnView).join("") + `<div class="footer"></div>`
  composerView()
  state.fresh.clear()
  if (toEnd || (follow && atBottom)) scroller.scrollTop = scroller.scrollHeight
}

document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act
  if (act === "now") sendNow()
  else if (act === "stop") stop()
  else if (act === "send") send()
})
const field = document.getElementById("field")
field.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send() } })
field.addEventListener("input", composerView)

function start() {
  clearInterval(timer); clearInterval(clock)
  if (playing) timer = setInterval(tick, 2600)
  clock = setInterval(() => {
    const t = turn()
    const el = document.querySelector(`[data-clock="${state.turns.length - 1}"]`)
    if (el && t.endAt === null) el.textContent = duration(Date.now() - t.startAt)
  }, 1000)
}
const playBtn = document.getElementById("play")
function togglePlay() { playing = !playing; playBtn.setAttribute("aria-pressed", playing); playBtn.textContent = playing ? "Agent running" : "Agent paused"; start() }
playBtn.addEventListener("click", togglePlay)

function mount() {
  seed()
  field.value = ""
  render()
  scroller.scrollTop = scroller.scrollHeight
  start()
}

// Picker wiring, from PICKER.md
const picker = document.querySelector(".proto-picker")
const highlight = picker.querySelector(".proto-picker-highlight")
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")]
const replay = picker.querySelector(".proto-picker-replay")
function moveHighlight() {
  const el = items[variant]
  highlight.style.width = el.offsetWidth + "px"
  highlight.style.transform = `translateX(${el.offsetLeft}px)`
}
function setActive(i) {
  if (i < 0 || i >= items.length) return
  variant = i
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i)
    if (j === i) el.setAttribute("aria-current", "true")
    else el.removeAttribute("aria-current")
  })
  moveHighlight()
  const url = new URL(location)
  url.searchParams.set("v", i + 1)
  history.replaceState(null, "", url)
  requestAnimationFrame(mount)
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)))
replay.addEventListener("click", () => mount())
window.addEventListener("resize", moveHighlight)
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= items.length) setActive(num - 1)
  else if (e.key === "ArrowRight") setActive((variant + 1) % items.length)
  else if (e.key === "ArrowLeft") setActive((variant - 1 + items.length) % items.length)
  else if (e.key === "r" || e.key === "R") mount()
  else if (e.key === "p" || e.key === "P") togglePlay()
})
const requested = parseInt(new URLSearchParams(location.search).get("v"), 10)
setActive(requested >= 1 && requested <= items.length ? requested - 1 : 0)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")))
</script>
</body>
</html>
